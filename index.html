async function toggleMic(){if(micStream){stopMic();return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micCtx=new (window.AudioContext||window.webkitAudioContext)();const src=micCtx.createMediaStreamSource(micStream),an=micCtx.createAnalyser();an.fftSize=512;src.connect(an);const data=new Uint8Array(an.frequencyBinCount);document.getElementById('micBtn').innerHTML='<i class="fa-solid fa-microphone-slash me-1"></i>Tắt micro';let lastWarn=0;const loop=()=>{an.getByteFrequencyData(data);const avg=data.reduce((a,b)=>a+b,0)/data.length;const pct=Math.min(100,Math.round(avg/90*100));const f=document.getElementById('noiseFill'),p=document.getElementById('noisePct'),st=document.getElementById('noiseStatus');if(f)f.style.width=pct+'%';if(p)p.textContent=pct+'%';if(st){st.className='alert mt-3 mb-0 '+(pct<40?'alert-success':pct<70?'alert-warning':'alert-danger');st.textContent=pct<40?'Lớp đang yên tĩnh — Tốt lắm!':pct<70?'Lớp hơi ồn — Hãy nhắc nhẹ các em.':'Mức ồn cao — Cần ổn định lớp.'}if(pct>72&&document.getElementById('autoNoise')?.checked&&Date.now()-lastWarn>7000){lastWarn=Date.now();beep(360,.2,.15)}micRAF=requestAnimationFrame(loop)};loop()}catch(e){Swal.fire({icon:'error',title:'Không mở được microphone',text:'Trình duyệt có thể yêu cầu HTTPS/localhost và quyền truy cập microphone.'})}}

function renderLinks(){const ls=[...state.links].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));const canEditLinks=isAdminRole()||isTeacherRole();const addBtn=canEditLinks?'<button class="btn btn-primary" onclick="openLinkModal()"><i class="fa-solid fa-plus me-1"></i>Thêm liên kết</button>':'';return `<div class="section-head"><div><h2><i class="fa-solid fa-link text-primary me-2"></i>Liên kết Tiện ích</h2><p>Lưu website, học liệu, Google Meet/Zoom và tài liệu hay dùng.</p></div>${addBtn}</div>${ls.length?`<div class="link-grid">${ls.map(l=>{const editButtons=canEditLinks?`<button class="icon-btn" onclick="openLinkModal('${l.id}')"><i class="fa-solid fa-pen"></i></button><button class="icon-btn text-danger" onclick="deleteLink('${l.id}')"><i class="fa-solid fa-trash"></i></button>`:'';return `<div class="card link-card hover-lift"><div class="d-flex gap-3"><div class="link-icon"><i class="fa-solid fa-link"></i></div><div class="flex-fill min-width-0"><div class="d-flex justify-content-between"><h5 class="fw-bold mb-1">${esc(l.name)} ${l.pinned?'📌':''}</h5></div><span class="badge text-bg-light">${esc(l.category)}</span><p class="text-muted small mt-2 mb-2">${esc(l.desc||'')}</p><div class="d-flex gap-2"><button class="btn btn-sm btn-primary" onclick="openSafeUrl('${encodeURIComponent(l.url)}')">Mở liên kết</button>${editButtons}</div></div></div></div>`}).join('')}</div>`:'<div class="card empty"><i class="fa-solid fa-book-open fs-1 mb-2"></i><h5>Chưa có liên kết tiện ích nào</h5><p>Hiện chưa có liên kết tiện ích nào được tạo.</p></div>'}`}
function openSafeUrl(encoded){let u=decodeURIComponent(encoded);if(!/^https?:\/\//i.test(u))u='https://'+u;window.open(u,'_blank','noopener')}
function openLinkModal(id=''){if(!(isAdminRole()||isTeacherRole())){showToast('Chỉ GVCN hoặc Quản trị cao nhất mới được thêm, sửa liên kết.','warning');return;}const l=state.links.find(x=>x.id===id)||{name:'',url:'https://',category:'Học liệu & SGK',desc:'',pinned:false};showModal(id?'Sửa liên kết':'Thêm Liên Kết Mới',`<form onsubmit="saveLink(event,'${id}')"><div class="mb-3"><label class="form-label fw-bold">Tên liên kết / Trang web *</label><input id="lName" class="form-control" required value="${esc(l.name)}"></div><div class="mb-3"><label class="form-label fw-bold">Địa chỉ URL (Link) *</label><input id="lUrl" class="form-control" required value="${esc(l.url)}"></div><div class="mb-3"><label class="form-label fw-bold">Danh mục</label><select id="lCat" class="form-select">${['Học liệu & SGK','Google Meet / Zoom','Bài tập','Trò chơi học tập','Tài liệu giáo viên','Khác'].map(x=>`<option ${l.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="mb-3"><label class="form-label fw-bold">Mô tả ngắn</label><input id="lDesc" class="form-control" value="${esc(l.desc)}"></div><div class="form-check"><input id="lPin" class="form-check-input" type="checkbox" ${l.pinned?'checked':''}><label class="form-check-label fw-bold">Ghim liên kết này lên đầu trang</label></div><div class="text-end mt-4"><button class="btn btn-primary">Thêm / Lưu Liên Kết</button></div></form>`)}
function saveLink(e,id){e.preventDefault();if(!(isAdminRole()||isTeacherRole())){showToast('Bạn không có quyền thêm hoặc sửa liên kết.','warning');return;}const d={name:document.getElementById('lName').value.trim(),url:document.getElementById('lUrl').value.trim(),category:document.getElementById('lCat').value,desc:document.getElementById('lDesc').value.trim(),pinned:document.getElementById('lPin').checked};if(id)Object.assign(state.links.find(x=>x.id===id),d);else state.links.push({id:uid('l'),...d});saveState();mainModal.hide();renderPage()}
async function deleteLink(id){if(!(isAdminRole()||isTeacherRole())){showToast('Chỉ GVCN hoặc Quản trị cao nhất mới được xóa liên kết.','warning');return;}const ok=await verifyAdminAccess();if(!ok)return;state.links=state.links.filter(x=>x.id!==id);saveState();renderPage()}

function renderStats(){const ss=classStudents(),tx=state.transactions.filter(x=>x.classId===state.activeClassId),total=ss.reduce((a,s)=>a+s.coins,0),plus=tx.filter(x=>x.amount>0).length,minus=tx.filter(x=>x.amount<0).length,male=ss.filter(s=>s.gender==='Nam').length,female=ss.filter(s=>s.gender==='Nữ').length;return `<div class="section-head"><div><h2><i class="fa-solid fa-chart-column text-primary me-2"></i>Thống Kê Điểm Thi Đua & Lịch Sử Tích Đổi</h2><p>Tổng hợp thi đua theo lớp, theo môn và nhật ký cộng/trừ điểm.</p></div><div class="d-flex gap-2"><button class="btn btn-outline-primary" onclick="exportStatsXlsx()"><i class="fa-solid fa-file-excel me-1"></i>Xuất Excel đầy đủ</button><button class="btn btn-primary" onclick="exportStatsPDF()"><i class="fa-solid fa-file-pdf me-1"></i>Xuất PDF</button></div></div><div id="statsReport"><div class="stats-grid"><div class="stat-card"><div class="label">Sĩ số học sinh</div><div class="value">${ss.length}</div><small>${male} Nam · ${female} Nữ</small><i class="fa-solid fa-users"></i></div><div class="stat-card"><div class="label">Tổng điểm thi đua</div><div class="value">${total}</div><small>${ss.length?Math.round(total/ss.length):0} điểm TB/HS</small><i class="fa-solid fa-award"></i></div><div class="stat-card"><div class="label">Lượt cộng (+điểm)</div><div class="value">${plus}</div><small>Khen thưởng ghi nhận</small><i class="fa-solid fa-plus"></i></div><div class="stat-card"><div class="label">Lượt trừ (-điểm)</div><div class="value">${minus}</div><small>Nhắc nhở nề nếp</small><i class="fa-solid fa-minus"></i></div></div><div class="grid-equal mt-3"><div class="card p-3"><h5 class="fw-bold">Bảng Xếp Hạng Điểm Thi Đua</h5>${[...ss].sort((a,b)=>b.coins-a.coins).map((s,i)=>rankRow(s,i)).join('')}</div><div class="card p-3"><h5 class="fw-bold">Cơ Cấu Học Sinh & Tỷ Lệ Thi Đua</h5><div style="height:280px"><canvas id="genderChart"></canvas></div></div></div><div class="grid-equal mt-3"><div class="card p-3"><h5 class="fw-bold">Thống kê theo môn học</h5><div style="height:300px"><canvas id="subjectChart"></canvas></div></div><div class="card p-3"><h5 class="fw-bold">Điểm theo học sinh</h5><div style="height:300px"><canvas id="coinChart"></canvas></div></div></div></div><div class="card p-3 mt-3"><div class="d-flex justify-content-between flex-wrap gap-2"><h5 class="fw-bold">Lịch sử Cộng / Trừ Chi Tiết (${tx.length})</h5><div class="d-flex gap-2"><select id="txSubjectFilter" class="form-select form-select-sm" onchange="filterTxTable()"><option value="">Tất cả môn</option>${state.subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="txSearch" class="form-control form-control-sm" placeholder="Tìm tên / lý do" oninput="filterTxTable()"></div></div><div class="table-responsive"><table class="table mt-2" id="txTable"><thead><tr><th>Thời gian</th><th>Học sinh</th><th>Môn</th><th>Lý do</th><th>Điểm</th></tr></thead><tbody>${tx.map(txRow).join('')}</tbody></table></div></div>`}
function txRow(x){return `<tr data-subject="${esc(x.subject)}" data-search="${esc((x.studentName+' '+x.reason).toLowerCase())}"><td>${new Date(x.time).toLocaleString('vi-VN')}</td><td>${esc(x.studentName)}</td><td>${esc(x.subject)}</td><td>${esc(x.reason)}</td><td><span class="badge ${x.amount>=0?'bg-success':'bg-danger'}">${x.amount>=0?'+':''}${x.amount}</span></td></tr>`}
function filterTxTable(){const sub=document.getElementById('txSubjectFilter').value,q=document.getElementById('txSearch').value.toLowerCase();document.querySelectorAll('#txTable tbody tr').forEach(r=>r.style.display=(!sub||r.dataset.subject===sub)&&r.dataset.search.includes(q)?'':'none')}
function drawStatsCharts(){const ss=classStudents(),tx=state.transactions.filter(x=>x.classId===state.activeClassId);const m=ss.filter(s=>s.gender==='Nam').length,f=ss.filter(s=>s.gender==='Nữ').length,o=ss.length-m-f;const g=document.getElementById('genderChart');if(g)chartRefs.push(new Chart(g,{type:'doughnut',data:{labels:['Nam','Nữ','Khác'],datasets:[{data:[m,f,o],backgroundColor:['#0ea5e9','#f472b6','#94a3b8']}]},options:{maintainAspectRatio:false}}));const map={};tx.forEach(x=>map[x.subject]=(map[x.subject]||0)+x.amount);const sc=document.getElementById('subjectChart');if(sc)chartRefs.push(new Chart(sc,{type:'bar',data:{labels:Object.keys(map),datasets:[{label:'Điểm ròng',data:Object.values(map),backgroundColor:'rgba(20,184,166,.7)',borderRadius:7}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}}));const cc=document.getElementById('coinChart');if(cc)chartRefs.push(new Chart(cc,{type:'line',data:{labels:ss.map(s=>s.name.split(' ').slice(-2).join(' ')),datasets:[{label:'Điểm',data:ss.map(s=>s.coins),borderColor:'#0d9488',backgroundColor:'rgba(13,148,136,.12)',fill:true,tension:.3}]},options:{maintainAspectRatio:false}}))}
function exportStatsXlsx(){const ss=classStudents().map((s,i)=>({STT:i+1,'Học sinh':s.name,'Giới tính':s.gender,'Điểm':s.coins}));const tx=state.transactions.filter(x=>x.classId===state.activeClassId).map(x=>({'Thời gian':new Date(x.time).toLocaleString('vi-VN'),'Học sinh':x.studentName,'Môn':x.subject,'Lý do':x.reason,'Điểm':x.amount}));const red=state.redemptions.filter(x=>x.classId===state.activeClassId).map(x=>({'Thời gian':new Date(x.time).toLocaleString('vi-VN'),'Học sinh':x.studentName,'Quà':x.rewardName,'Chi phí điểm':x.cost}));downloadXlsx([['Xếp hạng',ss],['Cộng trừ điểm',tx],['Đổi thưởng',red]],`bao-cao-${activeClass().name}.xlsx`)}
async function exportStatsPDF(){const el=document.getElementById('statsReport');const canvas=await html2canvas(el,{scale:1.5,backgroundColor:'#fff'});const img=canvas.toDataURL('image/jpeg',.92);const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const w=190,h=canvas.height*w/canvas.width;let y=10;pdf.addImage(img,'JPEG',10,y,w,h);if(h>277){}pdf.save(`bao-cao-${activeClass().name}.pdf`);toast('Đã tạo PDF')}
function downloadXlsx(sheets,filename){const wb=XLSX.utils.book_new();sheets.forEach(([name,rows])=>{const ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});XLSX.writeFile(wb,filename)}
function renderData(){const size=(new Blob([JSON.stringify(state)]).size/1024).toFixed(1);return `<div class="section-head"><div><h2><i class="fa-solid fa-database text-primary me-2"></i>Quản lý Dữ liệu</h2><p>Sao lưu dữ liệu định kỳ để chuyển máy hoặc khôi phục khi cần.</p></div></div><div class="grid-equal"><div class="card p-4"><h4 class="fw-bold">📦 Sao lưu toàn bộ</h4><p class="text-muted">Xuất mọi lớp, học sinh, điểm danh, điểm thi đua, lịch, phần thưởng và cài đặt thành một tệp JSON.</p><button class="btn btn-primary" onclick="exportJSON()"><i class="fa-solid fa-download me-1"></i>Xuất file JSON sao lưu</button><div class="mt-3 small text-muted">Kích thước dữ liệu hiện tại: ~${size} KB</div></div><div class="card p-4"><h4 class="fw-bold">♻️ Khôi phục</h4><p class="text-muted">Nhập file JSON đã sao lưu từ ứng dụng này. Dữ liệu hiện tại sẽ được thay thế sau khi xác nhận.</p><button class="btn btn-outline-primary" onclick="document.getElementById('hiddenImport').click()"><i class="fa-solid fa-upload me-1"></i>Nhập file JSON</button></div></div><div class="card p-4 mt-3 border-danger"><h4 class="fw-bold text-danger">⚠️ Vùng dữ liệu nguy hiểm</h4><p class="text-muted">Đặt lại toàn bộ ứng dụng về dữ liệu mẫu ban đầu.</p><button class="btn btn-outline-danger" onclick="resetAllData()"><i class="fa-solid fa-trash-can me-1"></i>Xóa và tạo lại dữ liệu mẫu</button></div>`}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,`lop-hoc-vui-ve-backup-${today()}.json`);toast('Đã xuất bản sao lưu')}
async function importJSON(file){try{const text=await file.text(),obj=JSON.parse(text);if(!obj.version||!obj.classes||!obj.students)throw new Error('Sai cấu trúc');const r=await Swal.fire({icon:'warning',title:'Khôi phục dữ liệu?',text:'Dữ liệu hiện tại sẽ bị thay thế.',showCancelButton:true,confirmButtonText:'Khôi phục'});if(!r.isConfirmed)return;state=obj;saveState();buildNav();renderHeader();renderPage();toast('Khôi phục thành công')}catch(e){Swal.fire({icon:'error',title:'File không hợp lệ',text:e.message})}}

async function resetAllData(){
  const ok = await verifyAdminAccess();
  if(!ok) return;
  const r=await Swal.fire({icon:'warning',title:'Đặt lại toàn bộ dữ liệu?',text:'Thao tác này không thể hoàn tác nếu chưa sao lưu.',showCancelButton:true,confirmButtonText:'Đặt lại',confirmButtonColor:'#dc2626'});
  if(!r.isConfirmed)return;
  state=defaultState();saveState();buildNav();renderHeader();renderPage();
}

function roleLabel(role){
  return ({admin:'Quản trị cao nhất',teacher:'GVCN',leader:'Tổ trưởng'}[role] || 'Chưa đăng nhập');
}

function roleCanOpenPage(page){
  const role=currentAuthRole();
  if(page==='home' || page==='students' || page==='search') return true;
  if(role==='admin') return true;
  if(role==='teacher') return page!=='settings' && page!=='data';
  if(role==='leader') return page==='groups';
  return false;
}

/* Tất cả menu vẫn hiện; mục chưa có quyền sẽ bị khóa trực quan. */
buildNav=function(){
  const n=classStudents().length;
  const role=currentAuthRole();
  const items=NAV.map(([id,ic,label,b])=>{
    const allowed=roleCanOpenPage(id);
    const locked=!allowed;
    return `<a class="nav-link ${state.currentPage===id?'active':''} ${locked?'nav-locked':''}" data-page="${id}"
      title="${locked?'🔒 Cần đăng nhập '+(id==='settings'||id==='data'?'Quản trị cao nhất':id==='groups'?'đúng tài khoản Tổ trưởng':'GVCN'):''}"
      onclick="navigate('${id}')"><i class="fa-solid ${ic}"></i><span>${label}</span>${b==='count'?`<span class="mini-badge new">${n}</span>`:b?`<span class="mini-badge ${b==='NEW'?'new':''}">${b}</span>`:''}${locked?'<i class="fa-solid fa-lock ms-auto nav-lock-icon"></i>':''}</a>`;
  }).join('');
  document.getElementById('sideNav').innerHTML=items;
};

navigate=async function(page){
  if(!roleCanOpenPage(page)){
    if(page==='settings' || page==='data'){
      const ok=await verifySettingAccess();
      if(!ok) return;
      page=page;
    }else if(page==='groups' && currentAuthRole()!=='leader'){
      const ok=await verifyAdminAccess();
      if(!ok) return;
    }else{
      await Swal.fire({icon:'info',title:'Chức năng đang khóa',text:'Vui lòng đăng nhập đúng tài khoản để mở khóa chức năng này.',confirmButtonText:'Đóng'});
      return;
    }
  }
  if(state.currentPage==='noise'&&page!=='noise') stopMic();
  state.currentPage=page;
  saveState(false);
  buildNav(); renderHeader(); renderPage();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
};

/* Tổ trưởng được ghi điểm cho đúng thành viên của tổ; không thể ghi cho người ngoài tổ. */
async function leaderAdjustPoints(studentId,sign){
  if(currentAuthRole()!=='leader' || !leaderSession) return;
  const team=leaderTeamForSession();
  if(!team || !(team.studentIds||[]).includes(studentId)) return Swal.fire({icon:'error',title:'Không có quyền',text:'Bạn chỉ được thao tác với học sinh thuộc tổ của mình.'});
  const s=state.students.find(x=>x.id===studentId); if(!s)return;
  const {value:v,isConfirmed}=await Swal.fire({title:sign>0?'Cộng điểm thi đua':'Trừ điểm thi đua',html:`<b>${esc(s.name)}</b><br><span class="small text-muted">${esc(team.name)}</span>`,input:'number',inputValue:1,inputAttributes:{min:1,max:10,step:1},showCancelButton:true,confirmButtonText:'Xác nhận',cancelButtonText:'Hủy',preConfirm:x=>Math.max(1,Math.min(10,parseInt(x,10)||1))});
  if(!isConfirmed)return;
  const {value:reason}=await Swal.fire({title:'Nội dung ghi nhận',input:'text',inputPlaceholder:'Ví dụ: Phát biểu tốt, nói chuyện riêng...',showCancelButton:true,confirmButtonText:'Lưu',cancelButtonText:'Hủy'});
  if(reason===undefined)return;
  logTransaction(studentId,sign*v,reason||'Ghi nhận thi đua (Tổ trưởng)','Ghi chung / Nề nếp');
  renderPage();
}

/* Đăng nhập Tổ trưởng: tìm đúng tổ theo mật khẩu, không cho chọn tổ khác. */

    for(const t of teams){
      if(t.leaderPassword && t.leaderPassword===trimmed){ found={classId:clsId,teamId:t.id,leaderId:t.leaderId}; break; }
    }
    if(found)break;
  }
  if(!found) return Swal.fire({icon:'error',title:'Mật khẩu không đúng',text:'Mật khẩu Tổ trưởng không khớp với bất kỳ tổ nào.'});
  authSession={role:'leader',loginAt:Date.now()}; saveAuthSession();
  leaderSession=found;
  try{sessionStorage.setItem('leaderSessionKey',JSON.stringify(found));}catch(e){}
  state.activeClassId=found.classId;
  state.currentPage='groups';
  document.body.classList.remove('leader-mode');
  buildNav();renderHeader();renderPage();
  toast('Đăng nhập thành công: '+(leaderTeamForSession()?.name||'Tổ trưởng'));
};

enterLeaderMode=function(session){
  leaderSession=session; authSession={role:'leader',loginAt:Date.now()}; saveAuthSession();
  try{sessionStorage.setItem('leaderSessionKey',JSON.stringify(session));}catch(e){}
  state.activeClassId=session.classId; state.currentPage='groups';
  document.body.classList.remove('leader-mode'); buildNav();renderHeader();renderPage();
};

leaderLogout=function(){ logoutCurrentAccount(); };

/* Menu Đăng nhập: đóng hộp chọn trước khi mở hộp mật khẩu, tránh Swal lồng nhau bị vô hiệu. */
loginAsAdmin=async function(){
  const result=await Swal.fire({title:'🔐 Đăng nhập Quản trị cao nhất',html:'<p class="small text-muted">Mở Cài đặt, Dữ liệu và toàn bộ quyền cao nhất.</p>',input:'password',inputAttributes:{autocomplete:'current-password'},inputPlaceholder:'Mật khẩu Quản trị cao nhất...',showCancelButton:true,confirmButtonText:'Đăng nhập',cancelButtonText:'Hủy',confirmButtonColor:'#0d9488'});
  if(!result.isConfirmed)return;
  const pass=state.settingPassword||'admin8b1';
  if(result.value===pass){authSession={role:'admin',loginAt:Date.now()};leaderSession=null;isAdminUnlocked=true;saveAuthSession();buildNav();renderHeader();renderPage();toast('Đã mở khóa Quản trị cao nhất');}
  else Swal.fire({icon:'error',title:'Mật khẩu Quản trị không chính xác'});
};
loginAsTeacher=async function(){
  const result=await Swal.fire({title:'🔐 Đăng nhập GVCN',html:'<p class="small text-muted">Mở các chức năng quản lý, điểm danh, thi đua, chia tổ, sơ đồ và TKB. Cài đặt/Dữ liệu vẫn thuộc Quản trị cao nhất.</p>',input:'password',inputAttributes:{autocomplete:'current-password'},inputPlaceholder:'Mật khẩu GVCN...',showCancelButton:true,confirmButtonText:'Đăng nhập',cancelButtonText:'Hủy',confirmButtonColor:'#0d9488'});
  if(!result.isConfirmed)return;
  const pass=state.adminPassword||'123';
  if(result.value===pass){authSession={role:'teacher',loginAt:Date.now()};leaderSession=null;isAdminUnlocked=false;saveAuthSession();state.currentPage='home';buildNav();renderHeader();renderPage();toast('Đã mở khóa quyền GVCN');}
  else Swal.fire({icon:'error',title:'Mật khẩu GVCN không chính xác'});
};
loginAsLeader=async function(){ await openLeaderLogin(); };

openLoginMenu=function(){
  const role=currentAuthRole();
  if(role){
    Swal.fire({icon:'info',title:'Đang đăng nhập: '+roleLabel(role),html:`<p class="mb-2">Quyền mở khóa chỉ có hiệu lực trên tab/trình duyệt hiện tại.</p>`,showCancelButton:true,showConfirmButton:true,confirmButtonText:'🔒 Đăng xuất & khóa',cancelButtonText:'Đóng',confirmButtonColor:'#dc2626'}).then(r=>{if(r.isConfirmed)logoutCurrentAccount();});
    return;
  }
  Swal.fire({title:'🔐 Chọn loại tài khoản',html:`<div class="d-grid gap-2 text-start">
    <button type="button" class="btn btn-outline-danger p-3" id="pickAdminLogin"><i class="fa-solid fa-crown me-2"></i><b>Quản trị cao nhất</b><div class="small text-muted ms-4">Toàn quyền, gồm Cài đặt và Dữ liệu</div></button>
    <button type="button" class="btn btn-outline-primary p-3" id="pickTeacherLogin"><i class="fa-solid fa-chalkboard-user me-2"></i><b>GVCN</b><div class="small text-muted ms-4">Quản lý và thao tác hằng ngày</div></button>
    <button type="button" class="btn btn-outline-success p-3" id="pickLeaderLogin"><i class="fa-solid fa-user-shield me-2"></i><b>Tổ trưởng</b><div class="small text-muted ms-4">Chỉ mở đúng tổ được cấp mật khẩu</div></button>
  </div>`,showConfirmButton:false,showCancelButton:true,cancelButtonText:'Hủy',didOpen:()=>{
    document.getElementById('pickAdminLogin')?.addEventListener('click',()=>{Swal.close();setTimeout(loginAsAdmin,80)});
    document.getElementById('pickTeacherLogin')?.addEventListener('click',()=>{Swal.close();setTimeout(loginAsTeacher,80)});
    document.getElementById('pickLeaderLogin')?.addEventListener('click',()=>{Swal.close();setTimeout(loginAsLeader,80)});
  }});
};

logoutCurrentAccount=function(){
  authSession=null; isAdminUnlocked=false; leaderSession=null;
  try{sessionStorage.removeItem('classAuthSession');sessionStorage.removeItem('leaderSessionKey');}catch(e){}
  document.body.classList.remove('leader-mode'); state.currentPage='home';
  buildNav();renderHeader();renderPage();toast('Đã đăng xuất và khóa quyền trên tab này','info');
};

/* Nút Tìm kiếm: luôn hoạt động, không phụ thuộc quyền đăng nhập. */
openStudentSearch=async function(){
  const {value:q,isConfirmed}=await Swal.fire({title:'🔎 Tìm kiếm học sinh',input:'text',inputPlaceholder:'Nhập họ tên hoặc một phần tên...',showCancelButton:true,confirmButtonText:'Tìm kiếm',cancelButtonText:'Hủy',inputAttributes:{autocomplete:'off'}});
  if(!isConfirmed||!q?.trim())return;
  const nq=norm(q.trim());

  if(!matches.length)return Swal.fire({icon:'info',title:'Không tìm thấy học sinh',text:`Không có học sinh phù hợp với “${q.trim()}”.`});
  Swal.fire({title:`🔎 Kết quả: ${matches.length} học sinh`,html:`<div class="text-start" style="max-height:70vh;overflow:auto">${matches.map(studentSearchCard).join('')}</div>`,width:960,confirmButtonText:'Đóng'});
};

/* Khi đổi lớp, Tổ trưởng không được chuyển sang lớp khác. */
switchClass=function(id){
  if(currentAuthRole()==='leader'){
    if(id!==leaderSession?.classId)return toast('Tổ trưởng không được chuyển lớp','warning');

};

   Xóa thêm khi trang bị đóng để tránh giữ phiên trong phiên khôi phục của trình duyệt. */

/* =========================================================
   PATCH CUỐI: QUYỀN XEM / QUYỀN SỬA THEO LỚP
   - Không đăng nhập: xem được TẤT CẢ các Tab, không sửa/xóa/thêm.
   - Quản trị cao nhất: toàn quyền tất cả lớp.
   - GVCN: chỉ được sửa lớp đã đăng nhập bằng mật khẩu riêng của lớp.
   - Tổ trưởng: chỉ thao tác đúng tổ đã cấp mật khẩu.
   ========================================================= */
roleCanOpenPage=function(page){ return true; };

buildNav=function(){
  const n=classStudents().length;
  document.getElementById('sideNav').innerHTML=NAV.map(([id,ic,label,b])=>
    `<a class="nav-link ${state.currentPage===id?'active':''}" data-page="${id}" onclick="navigate('${id}')"><i class="fa-solid ${ic}"></i><span>${label}</span>${b==='count'?`<span class="mini-badge new">${n}</span>`:b?`<span class="mini-badge ${b==='NEW'?'new':''}">${b}</span>`:''}</a>`
  ).join('');
};

navigate=async function(page){
  if(state.currentPage==='noise'&&page!=='noise') stopMic();
  state.currentPage=page;
  saveState(false);
  buildNav(); renderHeader(); renderPage();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
};

/* GVCN đăng nhập bằng mật khẩu riêng của từng lớp. */
loginAsTeacher=async function(){
  const rows=(state.classes||[]).filter(c=>c.teacherPassword);
  const result=await Swal.fire({
    title:'🔐 Đăng nhập GVCN',
    html:'<p class="small text-muted">Nhập mật khẩu GVCN. Hệ thống sẽ tự xác định đúng lớp được cấp mật khẩu.</p>',
    input:'password', inputAttributes:{autocomplete:'current-password'}, inputPlaceholder:'Mật khẩu GVCN...',
    showCancelButton:true, confirmButtonText:'Đăng nhập', cancelButtonText:'Hủy', confirmButtonColor:'#0d9488'
  });
  if(!result.isConfirmed) return;
  const pass=String(result.value||'').trim();
  const cls=rows.find(c=>c.teacherPassword===pass);
  if(!cls){ return Swal.fire({icon:'error',title:'Mật khẩu GVCN không chính xác',text:'Mật khẩu không khớp với tài khoản GVCN của lớp nào.'}); }
  authSession={role:'teacher',classId:cls.id,loginAt:Date.now()};
  leaderSession=null; isAdminUnlocked=false; saveAuthSession();
  state.activeClassId=cls.id; state.currentPage='home';
  buildNav(); renderHeader(); renderPage();
  toast('Đã mở quyền GVCN cho '+cls.name);
};

/* Chỉ Quản trị cao nhất được sửa Cài đặt/Dữ liệu; GVCN không thể nâng quyền. */
verifySettingAccess=async function(){
  if(isAdminRole()) return true;
  const now=Date.now();
  if(now<settingLockUntil){
    const minutesLeft=Math.ceil((settingLockUntil-now)/60000);
    await Swal.fire({icon:'error',title:'Quản trị đang bị khóa',text:`Vui lòng thử lại sau ${minutesLeft} phút.`});
    return false;
  }
  const currentPass=state.settingPassword||'admin8b1';
  const r=await Swal.fire({title:'🔐 Đăng nhập Quản trị cao nhất',input:'password',inputPlaceholder:'Mật khẩu Quản trị cao nhất...',inputAttributes:{autocomplete:'current-password'},showCancelButton:true,confirmButtonText:'Đăng nhập',cancelButtonText:'Hủy'});
  if(!r.isConfirmed) return false;
  if(r.value===currentPass){ authSession={role:'admin',loginAt:Date.now()}; leaderSession=null; isAdminUnlocked=true; saveAuthSession(); updateAuthBtnUI(); return true; }
  settingFailCount++; if(settingFailCount>=5) settingLockUntil=Date.now()+3600000;
  await Swal.fire({icon:'error',title:'Mật khẩu không chính xác',text:settingFailCount>=5?'Đã khóa Quản trị trong 1 giờ.':`Còn ${5-settingFailCount} lần thử.`});
  return false;
};

/* verifyAdminAccess = quyền SỬA của GVCN. Không đăng nhập thì hỏi mật khẩu theo lớp; đã đăng nhập thì khóa theo classId. */
verifyAdminAccess=async function(){
  if(isAdminRole()) return true;
  if(isTeacherRole()){
    if(authSession.classId!==state.activeClassId){
      await Swal.fire({icon:'warning',title:'Không có quyền sửa lớp này',text:'Tài khoản GVCN hiện tại chỉ được quản lý lớp đã đăng nhập.'});
      return false;
    }
    return true;
  }
  if(isLeaderRole()) return false;

  const result=await Swal.fire({
    title:'🔐 Đăng nhập GVCN',
    html:'<p class="small text-muted">Nhập mật khẩu GVCN của lớp hiện tại. Mỗi lớp có mật khẩu riêng.</p>',
    input:'password',inputAttributes:{autocomplete:'current-password'},inputPlaceholder:'Mật khẩu GVCN của lớp này...',
    showCancelButton:true,confirmButtonText:'Đăng nhập',cancelButtonText:'Hủy'
  });
  if(!result.isConfirmed) return false;
  const cls=(state.classes||[]).find(c=>c.id===state.activeClassId);
  if(cls && cls.teacherPassword && String(result.value||'').trim()===cls.teacherPassword){
    authSession={role:'teacher',classId:cls.id,loginAt:Date.now()}; leaderSession=null; isAdminUnlocked=false; saveAuthSession(); updateAuthBtnUI(); return true;
  }
  await Swal.fire({icon:'error',title:'Mật khẩu GVCN không chính xác',text:'Hãy dùng đúng mật khẩu của lớp đang chọn.'});
  return false;
};

/* GVCN chỉ nhìn thấy/chọn được lớp của mình; Quản trị cao nhất xem và quản lý tất cả. */
switchClass=function(id){
  if(currentAuthRole()==='leader'){
    if(id!==leaderSession?.classId) return toast('Tổ trưởng không được chuyển lớp','warning');
    return;
  }
  if(isTeacherRole() && authSession.classId!==id) return toast('GVCN chỉ được quản lý lớp đã đăng nhập','warning');
  state.activeClassId=id; state.wheelExcluded=[]; saveState(); buildNav(); renderHeader(); renderPage();
};

renderHeader=(function(original){ return function(){
  original();
  const sel=document.getElementById('classSwitcher');
  if(sel && isTeacherRole()){
    const c=state.classes.find(x=>x.id===authSession.classId);
    sel.innerHTML=c?`<option value="${c.id}">${esc(c.name)} · ${classStudentsFor(c.id).length} HS</option>`:'';
    sel.disabled=true;
  } else if(sel) sel.disabled=false;
  updateAuthBtnUI();
};})(renderHeader);

/* Cấu hình mật khẩu GVCN luôn thuộc quyền Quản trị cao nhất. */
saveAdminPassword=async function(e){
  e.preventDefault();
  if(!isAdminRole()) return toast('Chỉ Quản trị cao nhất mới được đổi mật khẩu GVCN','warning');
  const val=document.getElementById('newAdminPass')?.value.trim();
  if(!val) return toast('Mật khẩu GVCN không được để trống','warning');
  const c=activeClass(); if(!c) return;
  c.teacherPassword=val; state.adminPassword=val; saveState();
  document.getElementById('newAdminPass').value='';
  toast('Đã cập nhật mật khẩu GVCN cho '+c.name);
};

/* Tìm kiếm học sinh: tìm trên toàn bộ dữ liệu và hiển thị ngay thông tin chi tiết. */
openStudentSearch=async function(){
  const r=await Swal.fire({title:'🔎 Tìm kiếm học sinh',input:'text',inputPlaceholder:'Nhập họ tên hoặc một phần tên...',showCancelButton:true,confirmButtonText:'Tìm kiếm',cancelButtonText:'Hủy',inputAttributes:{autocomplete:'off'}});
  if(!r.isConfirmed||!r.value?.trim()) return;
  const raw=r.value.trim(), q=norm(raw);
  const matches=(state.students||[]).filter(s=>norm(s.name).includes(q));
  if(!matches.length) return Swal.fire({icon:'info',title:'Không tìm thấy học sinh',text:`Không có học sinh phù hợp với “${raw}”.`});
  const details=matches.map(s=>{
    const c=state.classes.find(x=>x.id===s.classId);
    const tx=(state.transactions||[]).filter(x=>x.studentId===s.id);
    return `<div class="card p-3 mb-3 shadow-sm"><div class="d-flex gap-3 align-items-center">${renderAvatar(s,'student-avatar')}<div><h5 class="fw-bold mb-1">${esc(s.name)}</h5><div class="text-muted">${esc(c?.name||'Chưa xác định lớp')} · ${esc(s.gender||'')}</div><span class="coin-pill"><i class="fa-solid fa-award"></i>${s.coins||0} điểm</span></div></div><hr><div class="row g-2 small"><div class="col-md-6"><b>📍 Chỗ ngồi:</b> ${esc(getStudentSeatText(s))}</div><div class="col-md-6"><b>👥 Tổ:</b> ${esc(getStudentTeamText(s))}</div><div class="col-md-6"><b>⭐ Yêu thích:</b> ${s.favorite?'Có':'Không'}</div><div class="col-md-6"><b>📝 Ghi chú:</b> ${esc(s.note||'Không có')}</div><div class="col-12"><b>📊 Thi đua:</b> ${tx.length} lần ghi nhận · Tổng hiện tại ${s.coins||0} điểm</div></div><div class="text-end mt-3"><button type="button" class="btn btn-sm btn-primary" onclick="goToStudentFromSearch('${s.id}')"><i class="fa-solid fa-graduation-cap me-1"></i>Mở trong danh sách học sinh</button></div></div>`;
  }).join('');
  Swal.fire({title:`🔎 Thông tin học sinh (${matches.length})`,html:`<div class="text-start" style="max-height:72vh;overflow:auto">${details}</div>`,width:900,showConfirmButton:false,showCancelButton:true,cancelButtonText:'Đóng'});
};
function getStudentSeatText(s){
  const cfg=state.seating?.[s.classId]; if(!cfg) return 'Chưa xếp chỗ';
  for(const [idx,id] of Object.entries(cfg.assignments||{})) if(id===s.id){const n=+idx,seats=cfg.seats||14;return `Dãy ${Math.floor(n/seats)+1} · Bàn ${Math.floor((n%seats)/4)+1} · Ghế ${(n%4)+1}`;}
  return 'Chưa xếp chỗ';
}
function getStudentTeamText(s){
  const g=state.groups?.[s.classId]; if(!g) return 'Chưa vào tổ';
  const t=(g.teams||[]).find(t=>t.studentIds?.includes(s.id));
  return t ? t.name+(t.leaderId===s.id?' · Tổ trưởng':'') : 'Chưa vào tổ';
}

  renderHeader();
  renderPage();
  document.getElementById('hiddenImport').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});
  initFirebaseSync();
});
