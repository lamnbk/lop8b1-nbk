<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom 8B1 - Bảng điều khiển giáo viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <!-- Firebase: dùng để đồng bộ dữ liệu thời gian thực giữa GV và phụ huynh -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary-color: #0d9488;
      --primary-dark: #0f766e;
      --primary-light: #ccfbf1;
      --secondary-color: #14b8a6;
      --accent-color: #5eead4;
      --success-color: #16a34a;
      --warning-color: #d97706;
      --danger-color: #dc2626;
      --text-color: #1f2937;
      --light-text: #6b7280;
      --border-color: #5eead4;
      --background-light: #f0fdfa;
      --shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.2);
      --teal-gradient: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #5eead4 100%);
      --teal-gradient-dark: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      --shadow-3d: 0 8px 32px rgba(13, 148, 136, 0.3);
      --sidebar-w: 248px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ccfbf1 0%, #99f6e4 50%, #5eead4 100%);
      min-height: 100vh;
      color: var(--text-color);
      overflow-x: hidden;
    }
    body::before, body::after { content:""; position: fixed; inset: auto; z-index:-1; filter: blur(10px); opacity:.55; }
    body::before { width:420px; height:420px; right:-160px; top:80px; background:#fb7185; border-radius:50%; }
    body::after { width:380px; height:380px; left:-160px; bottom:-70px; background:#38bdf8; border-radius:50%; }
    .app-shell { display:flex; min-height:100vh; padding:14px; gap:14px; }
    .sidebar {
      width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:rgba(255,255,255,.97); border:2px solid rgba(94,234,212,.75);
      border-radius:22px; box-shadow:var(--shadow-3d); padding:15px 12px; position:sticky; top:14px; height:calc(100vh - 28px); overflow-y:auto;
    }
    .brand { display:flex; align-items:center; gap:10px; padding:5px 8px 14px; border-bottom:1px solid #e5e7eb; margin-bottom:10px; }
    .brand-logo { width:48px; height:48px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(145deg,#0f766e,#2dd4bf); color:#fff; font-size:.95rem; font-weight:900; letter-spacing:-.04em; box-shadow:0 9px 24px rgba(13,148,136,.28); border:2px solid rgba(255,255,255,.85); overflow:hidden; }
    .brand-logo img { width:100%; height:100%; object-fit:cover; }
    .brand-copy { min-width:0; }
    .brand-name { font-weight:900; font-size:1.08rem; line-height:1.08; color:#0f766e; letter-spacing:-.02em; }
    .brand-subtitle { display:block; margin-top:4px; font-size:.72rem; font-weight:650; color:#64748b; line-height:1.15; }
    .sidebar .nav-link { color:#475569; display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; margin:3px 0; font-weight:650; transition:.25s; cursor:pointer; position:relative; }
    .sidebar .nav-link:hover { transform:translateX(3px); background:#f0fdfa; color:var(--primary-dark); }
    .sidebar .nav-link.active { color:#fff; background:var(--teal-gradient); box-shadow:0 8px 20px rgba(13,148,136,.25); }
    .sidebar .nav-link i { width:20px; text-align:center; }
    .mini-badge { margin-left:auto; font-size:.65rem; padding:3px 7px; border-radius:999px; font-weight:800; background:#fee2e2; color:#ef4444; }
    .mini-badge.new { background:#d1fae5; color:#047857; }
    .guide-btn { border:none; width:100%; border-radius:13px; padding:11px; background:linear-gradient(135deg,#fb923c,#fbbf24); color:white; font-weight:800; margin-top:8px; box-shadow:0 8px 18px rgba(245,158,11,.23); }
    .author-box { margin-top:12px; padding:12px; border-radius:14px; background:linear-gradient(135deg,#eff6ff,#ecfdf5); border:1px solid #bfdbfe; font-size:.78rem; }
    .main-wrap { flex:1; min-width:0; }
    .topbar { background:rgba(255,255,255,.96); backdrop-filter:blur(12px); border:2px solid rgba(94,234,212,.7); border-radius:22px; box-shadow:var(--shadow-3d); padding:13px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:14px; z-index:20; }
    .page-title h1 { margin:0; font-size:clamp(1.35rem,2.5vw,2rem); font-weight:900; letter-spacing:-.03em; }
    .page-title p { margin:2px 0 0; color:var(--light-text); font-size:.9rem; }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .save-pill { padding:8px 12px; border:1px solid #99f6e4; background:#ecfdf5; color:#047857; border-radius:999px; font-weight:800; font-size:.82rem; white-space:nowrap; }
    .class-switcher { min-width:160px; background:#f5f3ff; border:1px solid #ddd6fe; border-radius:15px; padding:7px 10px; font-weight:800; color:#5b21b6; }
    .teacher-mini { display:flex; align-items:center; gap:9px; min-width:170px; }
    .avatar { width:44px; height:44px; border-radius:14px; object-fit:cover; background:var(--teal-gradient); color:#fff; display:grid; place-items:center; font-weight:900; border:2px solid white; box-shadow:0 4px 12px rgba(0,0,0,.1); overflow:hidden; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .teacher-mini strong { display:block; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }
    .teacher-mini small { color:var(--light-text); }
    .main-content { background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-radius:20px; box-shadow:var(--shadow-3d); margin-top:14px; padding:20px; min-height:calc(100vh - 115px); border:2px solid var(--border-color); }
    .card { border:2px solid rgba(94,234,212,.58); border-radius:20px; box-shadow:0 10px 30px rgba(13,148,136,.10); transition:all .35s ease; background:rgba(255,255,255,.97); }
    .card.hover-lift:hover { transform:translateY(-4px); box-shadow:0 18px 36px rgba(13,148,136,.20); border-color:var(--primary-color); }
    .card-header { border-radius:18px 18px 0 0 !important; font-weight:800; padding:1rem 1.2rem; background:var(--teal-gradient) !important; color:#fff !important; border:none !important; }
    .btn { border-radius:12px; font-weight:700; padding:.65rem 1rem; transition:.25s; box-shadow:0 3px 10px rgba(0,0,0,.06); }
    .btn:hover { transform:translateY(-1px); box-shadow:0 7px 18px rgba(0,0,0,.13); }
    .btn-primary { background:var(--teal-gradient); border-color:var(--primary-color); }
    .btn-primary:hover { background:var(--teal-gradient-dark); border-color:var(--primary-dark); }
    .btn-outline-primary { border:2px solid var(--primary-color); color:var(--primary-color); }
    .btn-outline-primary:hover { background:var(--teal-gradient); border-color:var(--primary-color); color:#fff; }
    .form-control,.form-select { border-radius:12px; border:2px solid #cbd5e1; transition:.2s; padding:10px 12px; background:#fff; }
    .form-control:focus,.form-select:focus { border-color:var(--primary-color); box-shadow:0 0 0 .2rem rgba(13,148,136,.17); }
    .section-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .section-head h2 { font-weight:900; margin:0; font-size:1.35rem; }
    .section-head p { color:var(--light-text); margin:3px 0 0; }
    .stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .stat-card { padding:17px; border-radius:18px; background:var(--teal-gradient); color:white; position:relative; overflow:hidden; min-height:116px; box-shadow:0 12px 26px rgba(13,148,136,.21); }
    .stat-card::after { content:""; position:absolute; width:90px; height:90px; right:-28px; top:-28px; border:18px solid rgba(255,255,255,.15); border-radius:50%; }
    .stat-card .value { font-size:1.8rem; font-weight:900; margin-top:8px; }
    .stat-card .label { font-size:.82rem; opacity:.92; font-weight:700; }
    .stat-card i { position:absolute; right:16px; bottom:13px; font-size:2.6rem; opacity:.22; }
    .grid-2 { display:grid; grid-template-columns:1.3fr .7fr; gap:14px; }
    .grid-equal { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .student-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .student-card { padding:14px; position:relative; }
    .student-top { display:flex; gap:12px; align-items:center; }
    .student-avatar { width:74px; height:74px; border-radius:18px; flex:0 0 74px; overflow:hidden; display:grid; place-items:center; font-weight:900; color:white; font-size:1.35rem; background:linear-gradient(135deg,#2dd4bf,#0ea5e9); box-shadow:0 6px 16px rgba(13,148,136,.2); }
    .student-avatar img { width:100%; height:100%; object-fit:cover; }
    .student-name { font-weight:900; font-size:1.05rem; }

    .coin-pill { display:inline-flex; gap:5px; align-items:center; margin-top:5px; color:#0f766e; background:#f0fdfa; border:1px solid #99f6e4; border-radius:999px; padding:4px 10px; font-weight:800; font-size:.82rem; cursor:pointer; transition:.2s; user-select:none; }
    .coin-pill:hover { transform:scale(1.05); filter:brightness(.96); box-shadow:0 2px 6px rgba(0,0,0,.1); }
    .coin-pill.negative { color:#b91c1c; background:#fee2e2; border-color:#fca5a5; }

    .student-actions { margin-top:12px; padding-top:10px; border-top:1px solid #e5e7eb; display:flex; gap:7px; flex-wrap:wrap; }
    .icon-btn { width:36px; height:36px; padding:0; display:grid; place-items:center; border-radius:10px; border:1px solid #d1d5db; background:white; color:#475569; }
    .plus-btn { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
    .minus-btn { background:#fff1f2; color:#be123c; border-color:#fecdd3; }
    .table { border-radius:15px; overflow:hidden; box-shadow:0 5px 15px rgba(13,148,136,.08); }
    .table thead th { background:var(--teal-gradient); color:white; border:none; font-weight:800; padding:12px; }
    .table tbody td { padding:11px 12px; border-color:#e2e8f0; vertical-align:middle; }
    .attendance-btn { border:1px solid #dbe3ea; padding:9px 10px; border-radius:12px; background:#ffffff; color:#475569; font-size:.84rem; font-weight:800; display:flex; align-items:center; justify-content:center; gap:7px; width:100%; }
    .attendance-btn:hover { transform:translateY(-1px); box-shadow:0 6px 14px rgba(15,23,42,.08); }
    .attendance-btn.present.active { background:#10b981; border-color:#10b981; color:#fff; }
    .attendance-btn.late.active { background:#f59e0b; border-color:#f59e0b; color:#fff; }
    .attendance-btn.excused.active { background:#3b82f6; border-color:#3b82f6; color:#fff; }
    .attendance-btn.unexcused.active { background:#ef4444; border-color:#ef4444; color:#fff; }
    .attendance-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .att-box { border-radius:15px; padding:12px; text-align:center; border:1px solid #e2e8f0; }
    .att-box strong { font-size:1.45rem; display:block; }
    .att-box.present{background:#ecfdf5;color:#047857}.att-box.late{background:#fffbeb;color:#b45309}.att-box.excused{background:#eff6ff;color:#1d4ed8}.att-box.unexcused{background:#fff1f2;color:#be123c}
    .mini-avatar { width:42px; height:42px; border-radius:12px; overflow:hidden; display:grid; place-items:center; background:var(--teal-gradient); color:#fff; font-weight:900; flex:0 0 42px; box-shadow:0 4px 10px rgba(13,148,136,.12); }
    .mini-avatar img { width:100%; height:100%; object-fit:cover; }
    .attendance-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; margin-top:14px; }
    .attendance-card { padding:14px; border:2px solid #d9fdf7; border-radius:20px; background:linear-gradient(135deg,#ffffff 0%,#f8fffe 100%); box-shadow:0 8px 24px rgba(13,148,136,.08); }
    .attendance-card-head { display:flex; gap:12px; align-items:center; }
    .attendance-stt { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:#e6fffa; color:#0f766e; font-weight:900; flex:0 0 30px; }
    .attendance-info { min-width:0; flex:1; }
    .attendance-name { font-weight:900; font-size:1.04rem; line-height:1.25; }
    .attendance-meta { font-size:.78rem; color:#64748b; margin-top:4px; }
    .status-pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 10px; font-size:.78rem; font-weight:800; margin-top:8px; }
    .status-pill.present { background:#ecfdf5; color:#047857; }
    .status-pill.late { background:#fffbeb; color:#b45309; }
    .status-pill.excused { background:#eff6ff; color:#1d4ed8; }
    .status-pill.unexcused { background:#fff1f2; color:#be123c; }
    .attendance-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
    .attendance-note { margin-top:10px; padding-top:10px; border-top:1px dashed #dbe7e9; font-size:.76rem; color:#64748b; }
    .board-wrap { background:#f8fafc; border-radius:18px; border:2px solid #cbd5e1; padding:16px; overflow:auto; }
    .class-board { min-width:680px; padding:16px; perspective:900px; }
    .class-board.mode-3d .seat-grid { transform:rotateX(16deg); transform-origin:top center; margin-top:8px; }
    .class-board.mode-3d .seat { box-shadow:0 12px 18px rgba(15,23,42,.13); transform:translateZ(8px); }
    .class-board.mode-3d .bench-card { box-shadow:0 12px 22px rgba(15,23,42,.15); transform:translateZ(8px); }
    .chalkboard { background:linear-gradient(135deg,#123a47,#0f4c5c); border:8px solid #9a6b3a; border-radius:12px; color:#fde68a; padding:17px; text-align:center; font-weight:900; letter-spacing:.08em; box-shadow:0 12px 24px rgba(15,23,42,.2); }
    .teacher-desk { width:230px; margin:18px auto 22px; padding:12px; text-align:center; border-radius:13px; background:#ede9fe; border:2px solid #c4b5fd; color:#6d28d9; font-weight:900; }
    .seat-grid { display:grid; gap:14px; align-items:start; }
    .seat-lane { background:#f1f5f9; border-radius:14px; padding:10px; display:grid; gap:10px; }
    .lane-label { text-align:center; background:var(--teal-gradient); color:white; font-weight:900; border-radius:999px; padding:5px 10px; }
    .seat { min-height:96px; border-radius:13px; border:2px dashed #cbd5e1; background:white; padding:8px; display:flex; align-items:center; gap:8px; position:relative; }
    .seat.filled { border-style:solid; border-color:#99f6e4; box-shadow:0 6px 14px rgba(13,148,136,.1); }
    .seat .mini-avatar { width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--teal-gradient);color:white;font-weight:900;overflow:hidden;flex:0 0 38px; }
    .seat .mini-avatar img{width:100%;height:100%;object-fit:cover}
    .seat small { color:#64748b; }

    .bench-card { background:white; border:2px solid #cbd5e1; border-radius:14px; padding:10px; box-shadow:0 4px 10px rgba(15,23,42,.05); }
    .bench-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed #cbd5e1; font-weight:800; color:#0f766e; font-size:.85rem; }
    .bench-slots { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .bench-slot { min-height:56px; border-radius:10px; border:2px dashed #cbd5e1; background:#f8fafc; padding:6px 8px; display:flex; align-items:center; gap:6px; cursor:pointer; transition:.2s; }
    .bench-slot:hover { border-color:var(--primary-color); background:#f0fdfa; }
    .bench-slot.filled { border-style:solid; border-color:#99f6e4; background:white; box-shadow:0 3px 8px rgba(13,148,136,.1); }
    .bench-slot .mini-avatar { width:32px; height:32px; flex:0 0 32px; border-radius:50%; font-size:.75rem; }
    .bench-slot .slot-title { font-size:.78rem; font-weight:800; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bench-slot .slot-empty { font-size:.74rem; color:#94a3b8; font-weight:700; }

    .filter-chip-group { display:flex; flex-wrap:wrap; gap:6px; }
    .filter-chip { border:1px solid #cbd5e1; background:#fff; color:#475569; padding:5px 12px; border-radius:999px; font-size:.82rem; font-weight:700; cursor:pointer; transition:.2s; }
    .filter-chip:hover { border-color:var(--primary-color); color:var(--primary-color); }
    .filter-chip.active { background:var(--teal-gradient); color:#fff; border-color:var(--primary-color); box-shadow:0 2px 6px rgba(13,148,136,.25); }

    .timetable { overflow-x: auto; overflow-y: hidden; width: 100%; padding-bottom: 6px; }
    .timetable-grid { display:grid; grid-template-columns:110px repeat(6,minmax(140px,1fr)); gap:1px; background:#cbd5e1; border:1px solid #cbd5e1; min-width:960px; border-radius:14px; overflow:hidden; margin-left: 0; }
    .tt-cell { background:white; min-height:72px; padding:8px; }
    .tt-head { background:var(--teal-gradient); color:white; font-weight:900; display:flex;align-items:center;justify-content:center;min-height:50px; text-align: center; }
    .tt-time { background:#f0fdfa; font-weight:800; color:#0f766e; display:flex;flex-direction:column;justify-content:center;text-align:center; }
    .lesson { border-radius:10px; padding:7px; background:#ecfeff; border-left:4px solid #0d9488; font-size:.82rem; cursor:pointer; }
    .reward-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .reward-card { overflow:hidden; }
    .reward-visual { height:125px; display:grid; place-items:center; font-size:3.5rem; background:linear-gradient(135deg,#ecfdf5,#cffafe); }
    .reward-body { padding:14px; }
    .alert-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .class-alert { min-height:110px; border-radius:17px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-weight:900; cursor:pointer; border:2px solid transparent; transition:.2s; }
    .class-alert:hover { transform:scale(1.02); }
    .noise-meter { height:24px; border-radius:999px; background:#e2e8f0; overflow:hidden; }
    .noise-fill { height:100%; width:0; background:linear-gradient(90deg,#10b981,#f59e0b,#ef4444); transition:width .1s linear; }
    .quiet-timer { width:170px;height:170px;border-radius:50%;display:grid;place-items:center;margin:auto;background:radial-gradient(circle,#fff 55%,#f0fdfa);border:12px solid #ccfbf1;font-size:2rem;font-weight:900;color:#0f766e; }
    .countdown-layout { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr); gap:15px; }
    .countdown-ring { width:min(390px,80vw); aspect-ratio:1; margin:10px auto; border-radius:50%; padding:18px; background:conic-gradient(var(--timer-color,#0d9488) var(--progress,100%),#e2e8f0 0); box-shadow:0 14px 34px rgba(15,23,42,.12); }
    .countdown-inner { width:100%;height:100%;border-radius:50%;background:#1e293b;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center; }
    .countdown-time { font-size:clamp(2.3rem,7vw,4.5rem);font-weight:900;letter-spacing:.04em; }
    .preset-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:7px; }
    .preset { border:1px solid #cbd5e1;border-radius:10px;padding:8px 4px;background:white;font-size:.75rem;font-weight:800;cursor:pointer; }
    .link-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:13px; }
    .link-card { padding:14px; }
    .link-card .link-icon { width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#ccfbf1;color:#0f766e;font-size:1.25rem; }
    .rank-row { display:grid; grid-template-columns:34px 44px 1fr auto; gap:10px; align-items:center; padding:10px; border-bottom:1px solid #e5e7eb; }
    .rank-no { width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fef3c7;color:#b45309;font-weight:900; }
    .progress-thin { height:7px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin-top:4px; }
    .progress-thin > div { height:100%; background:var(--teal-gradient); }

function logTransaction(studentId,amount,reason='Điều chỉnh điểm',subject='Ghi chung / Nề nếp'){
  const s=state.students.find(x=>x.id===studentId);
  if(!s)return;
  s.coins = (s.coins||0) + amount;
  state.transactions.unshift({
    id:uid('tx'),
    classId:s.classId,
    studentId,
    studentName:s.name,
    amount,
    reason,
    subject,
    time:new Date().toISOString()
  });
  saveState(false);
}

function getStudentCoinsByMonth(studentId, monthFilter){
  if(monthFilter === 'all') {
    const s = state.students.find(x=>x.id===studentId);
    return s ? (s.coins || 0) : 0;
  }
  const targetMonth = parseInt(monthFilter, 10);
  const txs = state.transactions.filter(x => {
    if(x.studentId !== studentId) return false;
    const d = new Date(x.time);
    return (d.getMonth() + 1) === targetMonth;
  });
  return txs.reduce((acc, cur) => acc + (cur.amount || 0), 0);
}

function viewStudentViolations(studentId){
  const s = state.students.find(x => x.id === studentId);
  if(!s) return;
  const list = state.transactions.filter(x => x.studentId === studentId);

  const filterLabel = currentFilterMonth === 'all' ? 'Cả năm học' : `Tháng ${currentFilterMonth}`;
  const filteredList = currentFilterMonth === 'all' 
    ? list 
    : list.filter(x => (new Date(x.time).getMonth() + 1) === parseInt(currentFilterMonth, 10));

  const totalFilteredCoins = filteredList.reduce((acc, cur) => acc + (cur.amount || 0), 0);
  const violationsCount = filteredList.filter(x => x.amount < 0).length;
  const rewardsCount = filteredList.filter(x => x.amount > 0).length;

  let tableHtml = '';
  if(filteredList.length === 0){
    tableHtml = `<div class="p-4 text-center text-muted">Chưa có ghi nhận vi phạm hay khen thưởng nào trong ${filterLabel.toLowerCase()}.</div>`;
  } else {
    tableHtml = `
      <div class="table-responsive" style="max-height:380px;overflow-y:auto">
        <table class="table table-bordered table-hover align-middle mb-0 text-start" style="font-size:0.85rem">
          <thead class="table-light sticky-top">
            <tr>
              <th>Thời gian & Tuần</th>
              <th>Môn / Nhóm</th>
              <th>Nội dung (Lý do / Vi phạm)</th>
              <th class="text-center">Điểm số</th>
              <th class="text-center" style="width:90px">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            ${filteredList.map(tx => {
              const d = new Date(tx.time);
              const m = d.getMonth() + 1;
              const w = getWeekOfMonth(d);
              const isMinus = tx.amount < 0;
              const dateStr = d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
              return `
                <tr class="${isMinus?'table-danger-subtle':''}">
                  <td>
                    <span class="badge ${isMinus?'bg-danger':'bg-success'} mb-1">Tuần ${w} · Tháng ${m}</span>
                    <div class="text-muted small">${dateStr}</div>
                  </td>
                  <td><b>${esc(tx.subject || 'Ghi chung')}</b></td>
                  <td>${esc(tx.reason || 'Điều chỉnh')}</td>
                  <td class="text-center fw-bold ${isMinus?'text-danger':'text-success'} fs-6">
                    ${isMinus ? tx.amount : '+'+tx.amount}
                  </td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-outline-primary p-1 px-2 me-1" title="Sửa (Cần mật khẩu GVCN)" onclick="editTransaction('${tx.id}', '${studentId}')">
                      <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger p-1 px-2" title="Xóa (Cần mật khẩu GVCN)" onclick="deleteTransaction('${tx.id}', '${studentId}')">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  Swal.fire({
    title: `Nhật ký Vi phạm & Khen thưởng`,
    html: `
      <div class="text-start mb-3">
        <div class="d-flex justify-content-between align-items-center pb-2 border-bottom">
          <div>
            <h5 class="fw-bold mb-0 text-primary">${esc(s.name)}</h5>
            <small class="text-muted">Bộ lọc: <b>${filterLabel}</b> (Nút Sửa/Xóa yêu cầu mật khẩu Quản trị)</small>
          </div>
          <div class="text-end">
            <span class="badge ${totalFilteredCoins<0?'bg-danger':'bg-success'} fs-6">${totalFilteredCoins} điểm</span>
          </div>

          <span class="badge bg-danger">🚨 Vi phạm: ${violationsCount} lần</span>

        </div>
      </div>
      ${tableHtml}
    `,
    width: 780,
    showConfirmButton: true,
    confirmButtonText: 'Đóng'
  });
}

async function editTransaction(txId, studentId){
  const ok = await verifyAdminAccess();
  if(!ok) {
    if(studentId) viewStudentViolations(studentId);
    return;
  }

  const tx = state.transactions.find(x => x.id === txId);
  const s = state.students.find(x => x.id === (studentId || tx?.studentId));
  if(!tx || !s) return;

  const d = new Date(tx.time);
  const dateVal = d.toISOString().slice(0, 10);
  const isNegative = tx.amount < 0;
  const absAmount = Math.abs(tx.amount);

  const {value: v} = await Swal.fire({
    title: 'Sửa ghi nhận vi phạm / khen thưởng',
    html: `
      <div class="text-start">
        <label class="form-label fw-bold">Loại ghi nhận</label>
        <select id="editTxType" class="form-select">
          <option value="-1" ${isNegative?'selected':''}>🚨 Vi phạm nề nếp (Trừ điểm)</option>
          <option value="1" ${!isNegative?'selected':''}>🌟 Khen thưởng thi đua (Cộng điểm)</option>
        </select>

        <label class="form-label fw-bold mt-2">Số lượng điểm</label>
        <input id="editTxAmount" type="number" min="1" class="form-control" value="${absAmount}">

        <label class="form-label fw-bold mt-2">Ngày ghi nhận (để tính đúng tuần & tháng)</label>
        <input id="editTxDate" type="date" class="form-control" value="${dateVal}">

        <label class="form-label fw-bold mt-2">Môn / Nhóm nội dung</label>
        <select id="editTxSubject" class="form-select">
          ${state.subjects.map(sub => `<option ${sub===tx.subject?'selected':''}>${esc(sub)}</option>`).join('')}
        </select>

        <label class="form-label fw-bold mt-2">Lý do / Nội dung chi tiết</label>
        <input id="editTxReason" class="form-control" value="${esc(tx.reason || '')}">
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: 'Lưu thay đổi',
    cancelButtonText: 'Hủy',
    preConfirm: () => {
      const type = parseInt(document.getElementById('editTxType').value, 10);
      const amt = parseInt(document.getElementById('editTxAmount').value, 10) || 1;
      const date = document.getElementById('editTxDate').value;
      const sub = document.getElementById('editTxSubject').value;
      const rsn = document.getElementById('editTxReason').value.trim();
      return {
        amount: type * amt,
        date,
        subject: sub,
        reason: rsn || (type < 0 ? 'Vi phạm nề nếp' : 'Khen thưởng thi đua')
      };
    }
  });

  if(!v) {
    if(state.currentPage === 'students') viewStudentViolations(studentId);
    return;
  }

  s.coins = (s.coins || 0) - tx.amount + v.amount;

  let newTime = new Date(tx.time);
  if(v.date){
    const parts = v.date.split('-');
    newTime.setFullYear(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }

  tx.amount = v.amount;
  tx.reason = v.reason;
  tx.subject = v.subject;
  tx.time = newTime.toISOString();

  saveState(false);
  renderPage();
  toast('Đã cập nhật lại ghi nhận thành công!');
  if(state.currentPage === 'students') {
    setTimeout(() => viewStudentViolations(studentId), 250);
  }
}

async function deleteTransaction(txId, studentId){
  const ok = await verifyAdminAccess();
  if(!ok) {
    if(studentId) viewStudentViolations(studentId);
    return;
  }

  const tx = state.transactions.find(x => x.id === txId);
  const s = state.students.find(x => x.id === (studentId || tx?.studentId));
  if(!tx || !s) return;

  const r = await Swal.fire({
    icon: 'warning',
    title: 'Xóa ghi nhận này?',
    html: `Bạn có chắc muốn xóa ghi nhận: <b>"${esc(tx.reason)}"</b> (${tx.amount > 0 ? '+'+tx.amount : tx.amount} điểm)?<br><small class="text-muted">Số điểm tương ứng sẽ được hoàn trả lại cho học sinh.</small>`,
    showCancelButton: true,
    confirmButtonText: 'Đồng ý xóa',
    cancelButtonText: 'Hủy',
    confirmButtonColor: '#dc2626'
  });

  if(!r.isConfirmed){
    if(state.currentPage === 'students') viewStudentViolations(studentId);
    return;
  }

  s.coins = (s.coins || 0) - tx.amount;
  state.transactions = state.transactions.filter(x => x.id !== txId);

  saveState(false);
  renderPage();
  toast('Đã xóa ghi nhận và cân đối lại điểm!');
  if(state.currentPage === 'students') {
    setTimeout(() => viewStudentViolations(studentId), 250);
  }
}

function exportWeeklyExcel(){
  let txs = state.transactions.filter(x => x.classId === state.activeClassId);
  if(weeklyMonth !== 'all'){
    txs = txs.filter(x => (new Date(x.time).getMonth() + 1) === parseInt(weeklyMonth, 10));
  }
  if(weeklyWeek !== 'all'){
    txs = txs.filter(x => getWeekOfMonth(new Date(x.time)) === parseInt(weeklyWeek, 10));
  }

  const rows = txs.map((tx, i) => {
    const d = new Date(tx.time);
    return {
      'STT': i + 1,
      'Tuần': 'Tuần ' + getWeekOfMonth(d),
      'Tháng': 'Tháng ' + (d.getMonth() + 1),
      'Thời gian': d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN'),
      'Học sinh': tx.studentName,
      'Môn/Nhóm': tx.subject,
      'Nội dung ghi nhận': tx.reason,
      'Điểm': tx.amount
    };
  });

  downloadXlsx([['Nhat_ki_tuan', rows]], `nhat-ki-tuan-${activeClass().name}-T${weeklyMonth}-W${weeklyWeek}.xlsx`);
  toast('Đã xuất Excel nhật kí tuần thành công!');

async function saveStudent(e,id){
  e.preventDefault();
  let avatar=document.getElementById('sAvatarOld').value;
  const f=document.getElementById('sAvatar').files[0];
  if(f)avatar=await readFileData(f);
  const d={name:document.getElementById('sName').value.trim(),gender:document.getElementById('sGender').value,coins:+document.getElementById('sCoins').value||0,avatar,note:document.getElementById('sNote').value.trim(),favorite:document.getElementById('sFav').checked};

  mainModal.hide();
  buildNav();
  renderHeader();
  renderPage();

}

async function handleStudentExcelFile(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  const ok = await verifyAdminAccess();
  if(!ok) return;

  try {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, {type:'array'});
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    const rows = XLSX.utils.sheet_to_json(worksheet, {header:1, defval:''});

    if(!rows || rows.length < 2){
      return Swal.fire({icon:'error', title:'Tệp trống hoặc sai định dạng', text:'File cần có dòng tiêu đề và ít nhất 1 học sinh.'});
    }

    let headerRowIdx = -1;
    let colName = -1, colGender = -1, colStt = -1;

    for(let r=0; r<Math.min(rows.length, 10); r++){
      const row = rows[r].map(c=>String(c).trim().toLowerCase());
      for(let c=0; c<row.length; c++){
        const text = row[c];
        if(colName === -1 && (text.includes('họ và tên') || text.includes('họ tên') || text.includes('họ và tên học sinh') || text === 'tên' || text.includes('học sinh'))){
          colName = c;
        }
        if(colGender === -1 && (text.includes('giới tính') || text.includes('phái') || text === 'nam/nữ' || text === 'gt')){
          colGender = c;
        }
        if(colStt === -1 && (text === 'stt' || text.includes('thứ tự') || text.includes('số tt'))){
          colStt = c;
        }
      }
      if(colName !== -1){
        headerRowIdx = r;
        break;
      }
    }

    if(headerRowIdx === -1){
      headerRowIdx = 0;
      colStt = 0;
      colName = 1;
      colGender = 2;
    }

    const newStudents = [];
    for(let r = headerRowIdx + 1; r < rows.length; r++){
      const row = rows[r];
      const rawName = String(row[colName] || '').trim();
      if(!rawName || rawName.toLowerCase() === 'họ và tên') continue;

      let gender = colGender !== -1 ? String(row[colGender] || '').trim() : '';
      if(gender){
        const gLow = gender.toLowerCase();
        if(gLow === 'x' || gLow === 'nữ' || gLow === 'nu' || gLow === 'female' || gLow === 'f') gender = 'Nữ';
        else if(gLow === 'nam' || gLow === 'male' || gLow === 'm') gender = 'Nam';
        else gender = gender.charAt(0).toUpperCase() + gender.slice(1);
      }

      newStudents.push({
        id: uid('s'),
        classId: state.activeClassId,
        name: rawName,
        gender: gender || 'Nữ',
        coins: 0,
        avatar: '',
        favorite: false,
        note: ''
      });
    }

    if(!newStudents.length){
      return Swal.fire({icon:'warning', title:'Không tìm thấy dữ liệu', text:'Không quét được danh sách học sinh từ file. Hãy kiểm tra lại các cột.'});
    }

    const {isConfirmed} = await Swal.fire({
      title: `Nhập ${newStudents.length} học sinh?`,
      html: `<div class="text-start small">
        <p>Đã tìm thấy <b>${newStudents.length}</b> học sinh từ tệp <b>${esc(file.name)}</b>.</p>
        <div class="border rounded p-2 bg-light mb-3" style="max-height:160px;overflow-y:auto">
          ${newStudents.slice(0, 8).map((s, idx)=>`<div>${idx+1}. ${esc(s.name)} - <i>${esc(s.gender)}</i></div>`).join('')}
          ${newStudents.length > 8 ? `<div class="text-muted">... và ${newStudents.length - 8} học sinh khác</div>`:''}
        </div>
        <p class="mb-0">Bạn muốn <b>thêm nối tiếp</b> vào danh sách hiện tại hay <b>thay thế toàn bộ</b> danh sách của lớp?</p>
      </div>`,
      showCancelButton: true,
      showDenyButton: true,
      confirmButtonText: '<i class="fa-solid fa-plus me-1"></i>Thêm nối tiếp',
      denyButtonText: '<i class="fa-solid fa-rotate me-1"></i>Thay thế danh sách cũ',
      cancelButtonText: 'Hủy'
    });

    if(isConfirmed){
      state.students.push(...newStudents);
    } else if(Swal.getDenyButton() && Swal.isVisible() && !isConfirmed) {
      const ok = await verifyAdminAccess();
      if(!ok) return;
      state.students = state.students.filter(s=>s.classId !== state.activeClassId).concat(newStudents);
      if(state.seating[state.activeClassId]) state.seating[state.activeClassId].assignments = {};
    } else {
      return;
    }

    saveState();
    buildNav();
    renderHeader();
    renderPage();
    toast(`Đã nhận ${newStudents.length} học sinh thành công!`);
  } catch(err){
    Swal.fire({icon:'error', title:'Lỗi đọc tệp', text: err.message});
  }
}

function renderAttendance(){const ss=classStudents(),date=document.getElementById('attDate')?.value||state.attendanceDate||today(),att=state.attendance[state.activeClassId+'_'+date]||{};return `<div class="section-head"><div><h2><i class="fa-solid fa-clipboard-check text-primary me-2"></i>Điểm danh lớp ${esc(activeClass().name)}</h2><p>Ảnh học sinh cạnh tên đã được thu nhỏ lại để không che bố cục. Bấm nhanh vào 1 trong 4 trạng thái cho từng em.</p></div><div class="d-flex gap-2 flex-wrap"><input id="attDate" type="date" class="form-control" style="width:160px" value="${date}" onchange="changeAttendanceDate(this.value)"><button class="btn btn-outline-primary" onclick="exportAttendance()"><i class="fa-solid fa-file-excel me-1"></i>Xuất Excel</button><button class="btn btn-primary" onclick="saveAttendanceSec()"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu điểm danh</button></div></div>${attendanceSummary(att,ss)}<div class="card p-3 mt-3"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><div><div class="fw-bold text-primary">Danh sách điểm danh</div><div class="small text-muted">Ảnh cạnh tên là avatar nhỏ, không còn bị phóng lớn như trước.</div></div><div class="small text-muted">Sĩ số: <strong>${ss.length}</strong> học sinh</div></div><div class="attendance-grid">${ss.map((s,i)=>{const st=att[s.id]||'present';const info=attendanceStatusInfo(st);return `<div class="attendance-card"><div class="attendance-card-head"><div class="attendance-stt">${i+1}</div>${renderAvatar(s,'mini-avatar')}<div class="attendance-info"><div class="attendance-name">${esc(s.name)}</div><div class="attendance-meta">${esc(activeClass().name)}${s.gender?` · ${esc(s.gender)}`:''}</div><div class="status-pill ${st}"><i class="fa-solid ${info.icon}"></i>${info.label}</div></div></div><div class="attendance-actions">${[['present','Có mặt','fa-circle-check'],['late','Đi muộn','fa-clock'],['excused','Có phép','fa-envelope-open-text'],['unexcused','Không phép','fa-circle-xmark']].map(([k,l,icon])=>`<button class="attendance-btn ${k} ${st===k?'active':''}" onclick="setAttendance('${s.id}','${k}')"><i class="fa-solid ${icon}"></i>${l}</button>`).join('')}</div><div class="attendance-note">${s.note?esc(s.note):'Có thể thêm hoặc đổi ảnh học sinh ở mục Học sinh.'}</div></div>`}).join('')}</div></div>`}

function exportAttendance(){const date=document.getElementById('attDate')?.value||today(),att=state.attendance[state.activeClassId+'_'+date]||{};const rows=classStudents().map((s,i)=>({'STT':i+1,'Họ tên':s.name,'Trạng thái':({present:'Có mặt',late:'Đi muộn',excused:'Có phép',unexcused:'Không phép'})[att[s.id]||'present']}));downloadXlsx([['Điểm danh',rows]],`diem-danh-${activeClass().name}-${date}.xlsx`)}

function seatingCfg(){
  if(!state.seating[state.activeClassId]){
    state.seating[state.activeClassId]={type:'2x7x4',lanes:2,seats:14,mode:'2d',assignments:{}};
  }
  const cfg=state.seating[state.activeClassId];
  if(!cfg.type){
    if(cfg.lanes===2 && cfg.seats===14) cfg.type='2x7x4';
    else if(cfg.lanes===2 && cfg.seats===12) cfg.type='2x6x4';
    else cfg.type='standard';
  }
  return cfg;
}

        <option value="2x6x4" ${cfg.type==='2x6x4'?'selected':''}>2 Dãy (mỗi dãy 6 bàn, 4 chỗ/bàn - 48 chỗ)</option>

function benchHtml(lane, row, rowsPerLane, cfg){

async function randomSeat(){
  const ok = await verifyAdminAccess();
  if(!ok) return;
  const cfg=seatingCfg(), ids=classStudents().map(s=>s.id).sort(()=>Math.random()-.5);

  if(cfg.type==='2x7x4' || cfg.type==='2x6x4'){

function timeSlots(){
  const t=[];
  const defaultSm=['07:30 - 08:05','08:15 - 08:50','09:05 - 09:40','09:50 - 10:25','10:35 - 11:10','11:15 - 11:50'];
  const defaultCh=['13:30 - 14:05','14:15 - 14:50','15:05 - 15:40','15:50 - 16:25','16:35 - 17:10'];
  if(!state.slotTimes) state.slotTimes = {};

  if(state.timetable.morning){
    for(let i=0;i<state.timetable.morningCount;i++){
      const id = 'S'+(i+1);
      const timeVal = state.slotTimes[id] !== undefined ? state.slotTimes[id] : (defaultSm[i] || '');
      t.push({id, label:'Tiết '+(i+1)+' Sáng', time: timeVal});
    }
  }
  if(state.timetable.afternoon){
    for(let i=0;i<state.timetable.afternoonCount;i++){
      const id = 'C'+(i+1);
      const timeVal = state.slotTimes[id] !== undefined ? state.slotTimes[id] : (defaultCh[i] || '');
      t.push({id, label:'Tiết '+(i+1)+' Chiều', time: timeVal});
    }
  }
  return t;
}

function renderNoise(){return `<div class="section-head"><div><h2><i class="fa-solid fa-shield-halved text-primary me-2"></i>Công cụ Chống Ồn</h2><p>Bấm cảnh báo tức thì, đếm ngược im lặng hoặc dùng microphone phát hiện tiếng ồn tự động.</p></div></div><div class="grid-equal"><div class="card p-3"><h5 class="fw-bold">🔔 Cảnh Báo Tức Thì</h5><div class="alert-grid mt-3"><div class="class-alert" style="background:#fef3c7;border-color:#f59e0b" onclick="classAlert('🤫','SHH! Im lặng nào!','#d97706')"><span class="fs-1">🤫</span>SHH! Im lặng nào!</div><div class="class-alert" style="background:#ffedd5;border-color:#fb923c" onclick="classAlert('⚠️','LỚP QUÁ ỒN!','#ea580c')"><span class="fs-1">⚠️</span>LỚP QUÁ ỒN!</div><div class="class-alert" style="background:#fee2e2;border-color:#ef4444" onclick="classAlert('🚨','DỪNG LẠI NGAY!','#dc2626')"><span class="fs-1">🚨</span>DỪNG LẠI NGAY!</div><div class="class-alert" style="background:#d1fae5;border-color:#10b981" onclick="classAlert('🌟','TUYỆT VỜI!','#059669')"><span class="fs-1">🌟</span>TUYỆT VỜI!</div></div></div><div class="card p-3"><h5 class="fw-bold">🎵 Đếm Ngược Im Lặng</h5><div class="quiet-timer" id="quietTimer">⏱️</div><div class="d-flex justify-content-center gap-2 flex-wrap mt-3">${[10,15,20,30,60].map(n=>`<button class="btn btn-outline-primary" onclick="startQuiet(${n})">${n}s</button>`).join('')}</div><div class="text-center text-muted small mt-2">Khi hết giờ sẽ tự động khen lớp “TUYỆT VỜI!”</div></div></div><div class="card p-3 mt-3"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><h5 class="fw-bold m-0">🎙️ Phát Hiện Tiếng Ồn Tự Động (Microphone)</h5><div><label class="form-check form-switch d-inline-block me-3"><input id="autoNoise" class="form-check-input" type="checkbox"><span class="form-check-label">Cảnh báo tự động</span></label><button id="micBtn" class="btn btn-outline-primary" onclick="toggleMic()"><i class="fa-solid fa-microphone me-1"></i>Bật micro</button></div></div><div class="d-flex justify-content-between mt-3"><span>Mức độ tiếng ồn</span><strong id="noisePct">0%</strong></div><div class="noise-meter mt-2"><div class="noise-fill" id="noiseFill"></div></div><div id="noiseStatus" class="alert alert-success mt-3 mb-0">Lớp đang yên tĩnh — Tốt lắm!</div><div class="row text-center small mt-2"><div class="col bg-success-subtle p-2 rounded-start">Yên tĩnh<br>0–40%</div><div class="col bg-warning-subtle p-2">Hơi ồn<br>40–70%</div><div class="col bg-danger-subtle p-2 rounded-end">Rất ồn<br>70–100%</div></div></div>`}
function classAlert(emoji,text,color){beep(text.includes('TUYỆT')?880:440,.3,.15);const o=document.createElement('div');o.className='full-alert-overlay';o.innerHTML=`<div class="full-alert-card" style="background:${color}"><div class="emoji">${emoji}</div><h2>${text}</h2><p>Nhấn bất kỳ đâu để đóng</p></div>`;o.onclick=()=>o.remove();document.body.appendChild(o);setTimeout(()=>o.remove(),3500)}
function startQuiet(sec){clearInterval(quietInterval);quietLeft=sec;const el=document.getElementById('quietTimer');if(el)el.textContent=quietLeft+'s';quietInterval=setInterval(()=>{quietLeft--;const x=document.getElementById('quietTimer');if(x)x.textContent=Math.max(0,quietLeft)+'s';if(quietLeft<=0){clearInterval(quietInterval);beep(880,.35,.15);classAlert('🌟','TUYỆT VỜI!','#059669')}},1000)}
async function toggleMic(){if(micStream){stopMic();return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micCtx=new (window.AudioContext||window.webkitAudioContext)();const src=micCtx.createMediaStreamSource(micStream),an=micCtx.createAnalyser();an.fftSize=512;src.connect(an);const data=new Uint8Array(an.frequencyBinCount);document.getElementById('micBtn').innerHTML='<i class="fa-solid fa-microphone-slash me-1"></i>Tắt micro';let lastWarn=0;const loop=()=>{an.getByteFrequencyData(data);const avg=data.reduce((a,b)=>a+b,0)/data.length;const pct=Math.min(100,Math.round(avg/90*100));const f=document.getElementById('noiseFill'),p=document.getElementById('noisePct'),st=document.getElementById('noiseStatus');if(f)f.style.width=pct+'%';if(p)p.textContent=pct+'%';if(st){st.className='alert mt-3 mb-0 '+(pct<40?'alert-success':pct<70?'alert-warning':'alert-danger');st.textContent=pct<40?'Lớp đang yên tĩnh — Tốt lắm!':pct<70?'Lớp hơi ồn — Hãy nhắc nhẹ các em.':'Mức ồn cao — Cần ổn định lớp.'}if(pct>72&&document.getElementById('autoNoise')?.checked&&Date.now()-lastWarn>7000){lastWarn=Date.now();beep(360,.2,.15)}micRAF=requestAnimationFrame(loop)};loop()}catch(e){Swal.fire({icon:'error',title:'Không mở được microphone',text:'Trình duyệt có thể yêu cầu HTTPS/localhost và quyền truy cập microphone.'})}}
function stopMic(){if(micRAF)cancelAnimationFrame(micRAF);if(micStream)micStream.getTracks().forEach(t=>t.stop());if(micCtx)micCtx.close();micRAF=null;micStream=null;micCtx=null;const b=document.getElementById('micBtn');if(b)b.innerHTML='<i class="fa-solid fa-microphone me-1"></i>Bật micro'}
function renderCountdown(){return `<div class="countdown-layout"><div class="card p-3"><div class="countdown-ring" id="countdownRing"><div class="countdown-inner"><div class="countdown-time" id="countdownTime">05:00</div><div class="text-uppercase small" id="countdownStatus">Sẵn sàng</div></div></div><div class="d-flex justify-content-center gap-2 flex-wrap"><button class="btn btn-light" onclick="adjustCountdown(-30)">−30s</button><button id="countdownStart" class="btn btn-primary px-5" onclick="toggleCountdown()"><i class="fa-solid fa-play me-1"></i>Bắt đầu</button><button class="btn btn-light" onclick="adjustCountdown(30)">+30s</button><button class="btn btn-outline-primary" onclick="resetCountdown()"><i class="fa-solid fa-rotate-left"></i></button></div><div class="form-check form-switch text-center mt-3"><input class="form-check-input" id="tickLast10" type="checkbox" ${state.settings.tickLast10?'checked':''} onchange="state.settings.tickLast10=this.checked;saveState(false)"><label class="form-check-label">Tiếng tick cuối 10 giây</label></div></div><div><div class="card p-3"><h5 class="fw-bold">⏱ Thiết lập thời gian</h5><div class="row g-2 text-center"><div class="col"><input id="timerH" type="number" min="0" max="9" class="form-control text-center fw-bold" value="0"><small>GIỜ</small></div><div class="col"><input id="timerM" type="number" min="0" max="59" class="form-control text-center fw-bold" value="5"><small>PHÚT</small></div><div class="col"><input id="timerS" type="number" min="0" max="59" class="form-control text-center fw-bold" value="0"><small>GIÂY</small></div></div><button class="btn btn-primary w-100 mt-3" onclick="applyTimerInputs()">✓ Áp dụng thời gian này</button></div><div class="card p-3 mt-3"><h5 class="fw-bold">⚡ Mẫu nhanh</h5><div class="preset-grid">${[1,3,5,10,15,20,25,30,45,60].map(m=>`<button class="preset" onclick="setCountdown(${m*60})">${m===60?'1 giờ':m+' phút'}</button>`).join('')}</div></div><div class="card p-3 mt-3"><h5 class="fw-bold">🎨 Màu sắc đồng hồ</h5><div class="d-flex gap-2 flex-wrap">${[['#7c3aed','Tím'],['#0ea5e9','Xanh'],['#0d9488','Lá'],['#f59e0b','Cam'],['#f43f5e','Hồng']].map(([c,n])=>`<button class="btn btn-sm" style="border:2px solid ${c};color:${c}" onclick="setTimerColor('${c}')">● ${n}</button>`).join('')}</div></div></div></div>`}
function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')}
function updateCountdownUI(){const t=document.getElementById('countdownTime'),r=document.getElementById('countdownRing'),st=document.getElementById('countdownStatus'),b=document.getElementById('countdownStart');if(t)t.textContent=fmtTime(countdown.left);if(r){const pct=countdown.total?countdown.left/countdown.total*100:0;r.style.setProperty('--progress',pct+'%');r.style.setProperty('--timer-color',state.settings.timerColor||'#0d9488')}if(st)st.textContent=countdown.running?'ĐANG ĐẾM NGƯỢC':'Sẵn sàng';if(b)b.innerHTML=countdown.running?'<i class="fa-solid fa-pause me-1"></i>Tạm dừng':'<i class="fa-solid fa-play me-1"></i>Bắt đầu'}
function setCountdown(s){clearInterval(countdownInterval);countdown={total:s,left:s,running:false};updateCountdownUI()}function applyTimerInputs(){const s=(+document.getElementById('timerH').value||0)*3600+(+document.getElementById('timerM').value||0)*60+(+document.getElementById('timerS').value||0);setCountdown(Math.max(1,s))}function adjustCountdown(n){countdown.left=Math.max(0,countdown.left+n);countdown.total=Math.max(countdown.total,countdown.left);updateCountdownUI()}function resetCountdown(){clearInterval(countdownInterval);countdown.left=countdown.total;countdown.running=false;updateCountdownUI()}
function toggleCountdown(){if(countdown.running){clearInterval(countdownInterval);countdown.running=false;updateCountdownUI();return}if(countdown.left<=0)countdown.left=countdown.total;countdown.running=true;updateCountdownUI();clearInterval(countdownInterval);countdownInterval=setInterval(()=>{countdown.left--;if(state.settings.tickLast10&&countdown.left<=10&&countdown.left>0)beep(900,.05,.04);if(countdown.left<=0){clearInterval(countdownInterval);countdown.running=false;beep(880,.5,.18);Swal.fire({icon:'success',title:'Hết giờ!',text:'Đồng hồ đếm ngược đã kết thúc.'})}updateCountdownUI()},1000)}function setTimerColor(c){state.settings.timerColor=c;saveState(false);updateCountdownUI()}
function renderLinks(){const ls=[...state.links].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));return `<div class="section-head"><div><h2><i class="fa-solid fa-link text-primary me-2"></i>Liên kết Tiện ích</h2><p>Lưu website, học liệu, Google Meet/Zoom và tài liệu hay dùng.</p></div><button class="btn btn-primary" onclick="openLinkModal()"><i class="fa-solid fa-plus me-1"></i>Thêm liên kết</button></div>${ls.length?`<div class="link-grid">${ls.map(l=>`<div class="card link-card hover-lift"><div class="d-flex gap-3"><div class="link-icon"><i class="fa-solid fa-link"></i></div><div class="flex-fill min-width-0"><div class="d-flex justify-content-between"><h5 class="fw-bold mb-1">${esc(l.name)} ${l.pinned?'📌':''}</h5></div><span class="badge text-bg-light">${esc(l.category)}</span><p class="text-muted small mt-2 mb-2">${esc(l.desc||'')}</p><div class="d-flex gap-2"><button class="btn btn-sm btn-primary" onclick="openSafeUrl('${encodeURIComponent(l.url)}')">Mở liên kết</button><button class="icon-btn" onclick="openLinkModal('${l.id}')"><i class="fa-solid fa-pen"></i></button><button class="icon-btn text-danger" onclick="deleteLink('${l.id}')"><i class="fa-solid fa-trash"></i></button></div></div></div></div>`).join('')}</div>`:'<div class="card empty"><i class="fa-solid fa-book-open fs-1 mb-2"></i><h5>Chưa có liên kết tiện ích nào</h5><p>Hãy tạo các liên kết cố định cho lớp học.</p></div>'}`}

d">Thống kê theo môn học</h5><div style="height:300px"><canvas id="subjectChart"></canvas></div></div><div class="card p-3"><h5 class="fw-bold">Điểm theo học sinh</h5><div style="height:300px"><canvas id="coinChart"></canvas></div></div></div></div><div class="card p-3 mt-3"><div class="d-flex justify-content-between flex-wrap gap-2"><h5 class="fw-bold">Lịch sử Cộng / Trừ Chi Tiết (${tx.length})</h5><div class="d-flex gap-2"><select id="txSubjectFilter" class="form-select form-select-sm" onchange="filterTxTable()"><option value="">Tất cả môn</option>${state.subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="txSearch" class="form-control form-control-sm" placeholder="Tìm tên / lý do" oninput="filterTxTable()"></div></div><div class="table-responsive"><table class="table mt-2" id="txTable"><thead><tr><th>Thời gian</th><th>Học sinh</th><th>Môn</th><th>Lý do</th><th>Điểm</th></tr></thead><tbody>${tx.map(txRow).join('')}</tbody></table></div></div>`}

async function exportStatsPDF(){const el=document.getElementById('statsReport');const canvas=await html2canvas(el,{scale:1.5,backgroundColor:'#fff'});const img=canvas.toDataURL('image/jpeg',.92);const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const w=190,h=canvas.height*w/canvas.width;let y=10;pdf.addImage(img,'JPEG',10,y,w,h);if(h>277){}pdf.save(`bao-cao-${activeClass().name}.pdf`);toast('Đã tạo PDF')}
function downloadXlsx(sheets,filename){const wb=XLSX.utils.book_new();sheets.forEach(([name,rows])=>{const ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});XLSX.writeFile(wb,filename)}
function renderData(){const size=(new Blob([JSON.stringify(state)]).size/1024).toFixed(1);return `<div class="section-head"><div><h2><i class="fa-solid fa-database text-primary me-2"></i>Quản lý Dữ liệu</h2><p>Sao lưu dữ liệu định kỳ để chuyển máy hoặc khôi phục khi cần.</p></div></div><div class="grid-equal"><div class="card p-4"><h4 class="fw-bold">📦 Sao lưu toàn bộ</h4><p class="text-muted">Xuất mọi lớp, học sinh, điểm danh, điểm thi đua, lịch, phần thưởng và cài đặt thành một tệp JSON.</p><button class="btn btn-primary" onclick="exportJSON()"><i class="fa-solid fa-download me-1"></i>Xuất file JSON sao lưu</button><div class="mt-3 small text-muted">Kích thước dữ liệu hiện tại: ~${size} KB</div></div><div class="card p-4"><h4 class="fw-bold">♻️ Khôi phục</h4><p class="text-muted">Nhập file JSON đã sao lưu từ ứng dụng này. Dữ liệu hiện tại sẽ được thay thế sau khi xác nhận.</p><button class="btn btn-outline-primary" onclick="document.getElementById('hiddenImport').click()"><i class="fa-solid fa-upload me-1"></i>Nhập file JSON</button></div></div><div class="card p-4 mt-3 border-danger"><h4 class="fw-bold text-danger">⚠️ Vùng dữ liệu nguy hiểm</h4><p class="text-muted">Đặt lại toàn bộ ứng dụng về dữ liệu mẫu ban đầu.</p><button class="btn btn-outline-danger" onclick="resetAllData()"><i class="fa-solid fa-trash-can me-1"></i>Xóa và tạo lại dữ liệu mẫu</button></div>`}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,`lop-hoc-vui-ve-backup-${today()}.json`);toast('Đã xuất bản sao lưu')}
async function importJSON(file){try{const text=await file.text(),obj=JSON.parse(text);if(!obj.version||!obj.classes||!obj.students)throw new Error('Sai cấu trúc');const r=await Swal.fire({icon:'warning',title:'Khôi phục dữ liệu?',text:'Dữ liệu hiện tại sẽ bị thay thế.',showCancelButton:true,confirmButtonText:'Khôi phục'});if(!r.isConfirmed)return;state=obj;saveState();buildNav();renderHeader();renderPage();toast('Khôi phục thành công')}catch(e){Swal.fire({icon:'error',title:'File không hợp lệ',text:e.message})}}

async function resetAllData(){
  const ok = await verifyAdminAccess();
  if(!ok) return;
  const r=await Swal.fire({icon:'warning',title:'Đặt lại toàn bộ dữ liệu?',text:'Thao tác này không thể hoàn tác nếu chưa sao lưu.',showCancelButton:true,confirmButtonText:'Đặt lại',confirmButtonColor:'#dc2626'});
  if(!r.isConfirmed)return;
  state=defaultState();saveState();buildNav();renderHeader();renderPage();
}

        </div>
      </div>

      <div class="card setting-box mb-3">

          <li class="mb-2"><b>Mật khẩu Lớp 2 (Thao tác):</b> Mặc định là <code>123</code>. Dùng mỗi khi cộng/trừ điểm hoặc sửa/xóa các lỗi vi phạm trong tuần.</li>
          <li class="mb-2">Học sinh và phụ huynh khi mở trang web sẽ ở chế độ <b>Chỉ xem</b>, không thể mở Cài đặt và không thể xóa hay cộng trừ điểm.</li>

        </ul>

      <div class="card setting-box mt-3">
        <h5 class="fw-bold">📚 Danh sách môn học</h5>
        <p class="text-muted small">Các môn này xuất hiện khi cộng/trừ điểm và lập thời khóa biểu.</p>
        <div>${state.subjects.map(x=>`<span class="subject-chip">${esc(x)}</span>`).join('')}</div>

async function saveSettingPassword(e){
  e.preventDefault();
  const oldPass = document.getElementById('oldSettingPass').value.trim();
  const newPass = document.getElementById('newSettingPass').value.trim();
  const currentPass = state.settingPassword || 'admin8b1';

  if(oldPass !== currentPass){
    return Swal.fire({icon:'error', title:'Mật khẩu cũ không chính xác!'});
  }
  if(!newPass){
    return toast('Mật khẩu mới không được để trống!', 'warning');
  }

  state.settingPassword = newPass;
  saveState();
  document.getElementById('oldSettingPass').value = '';
  document.getElementById('newSettingPass').value = '';
  toast('Đã cập nhật Mật khẩu Lớp 1 (Cài đặt) thành công!');
}

async function saveAdminPassword(e){
  e.preventDefault();
  const val = document.getElementById('newAdminPass').value.trim();
  if(!val) return toast('Mật khẩu mới không được để trống!', 'warning');
  state.adminPassword = val;
  saveState();
  document.getElementById('newAdminPass').value = '';
  toast('Đã cập nhật Mật khẩu Lớp 2 (Thao tác GVCN) thành công!');
}

async function saveClassLogo(e){
  e.preventDefault();
  const curCls = activeClass();
  let logoImg = document.getElementById('classLogoImgOld').value;
  const f = document.getElementById('classLogoFileInput').files[0];
  if(f) logoImg = await readFileData(f);

  curCls.logoImage = logoImg;
  curCls.logoText = document.getElementById('classLogoTextInput').value.trim() || '8B1';
  curCls.name = document.getElementById('classNameInput').value.trim() || 'LỚP 8B1';

  saveState();
  renderHeader();
  renderPage();
  toast('Đã cập nhật Logo và Tên Lớp!');
}

function resetClassLogo(){
  const curCls = activeClass();
  curCls.logoImage = '';
  curCls.logoText = '8B1';
  saveState();
  renderHeader();
  renderPage();
  toast('Đã đặt lại Logo mặc định');
}

async function saveTeacher(e){e.preventDefault();const f=document.getElementById('teacherAvatarInput').files[0];if(f)state.teacher.avatar=await readFileData(f);state.teacher.name=document.getElementById('tName').value.trim();state.teacher.role=document.getElementById('tRole').value.trim();state.teacher.subject=document.getElementById('tSubject').value.trim();state.teacher.school=document.getElementById('tSchool').value.trim();saveState();renderHeader();renderPage();toast('Đã cập nhật thông tin giáo viên')}
async function editSubjects(){const {value}=await Swal.fire({title:'Tùy chỉnh danh sách môn',input:'textarea',inputValue:state.subjects.join('\n'),inputLabel:'Mỗi dòng một môn / nhóm',showCancelButton:true,confirmButtonText:'Lưu danh sách'});if(value===undefined)return;state.subjects=value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);saveState();renderPage()}
function showModal(title,html){document.getElementById('mainModalTitle').textContent=title;document.getElementById('mainModalBody').innerHTML=html;mainModal.show()}
function showGuide(){Swal.fire({width:760,title:'Hướng dẫn bảo mật',html:`<div class="text-start"><p><b>1. Mật khẩu Lớp 1 (Cài đặt):</b> Mặc định là <code>admin8b1</code>. Chuyên khóa tab Cài đặt & Dữ liệu. Không hiển thị sẵn trong mã nguồn giao diện để bảo mật. Nhập sai quá 5 lần khóa 1 giờ. Khi quên có thể bấm nút gửi về email: <code>${RECOVERY_EMAIL}</code>.</p><p><b>2. Mật khẩu Lớp 2 (Thao tác):</b> Mặc định là <code>123</code>. Dùng mỗi khi mở quyền thao tác hàng ngày cho GVCN (Cộng/trừ điểm, sửa/xóa vi phạm).</p><p><b>3. Nhật kí tuần:</b> Bấm tab Nhật kí tuần để xem danh sách vi phạm và thành tích theo từng tuần, từng tháng phục vụ sinh hoạt lớp.</p></div>`,confirmButtonText:'Đã hiểu'})}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function confettiLite(){for(let i=0;i<24;i++){const p=document.createElement('i');p.style.cssText=`position:fixed;z-index:100000;left:${Math.random()*100}vw;top:-10px;width:8px;height:12px;background:hsl(${Math.random()*360} 80% 55%);transform:rotate(${Math.random()*180}deg);transition:all ${1+Math.random()*1.4}s ease-in;pointer-events:none`;document.body.appendChild(p);requestAnimationFrame(()=>{p.style.top='105vh';p.style.transform+=` translateX(${(Math.random()-.5)*160}px) rotate(720deg)`});setTimeout(()=>p.remove(),2600)}}

document.addEventListener('DOMContentLoaded',()=>{
  mainModal=new bootstrap.Modal(document.getElementById('mainModal'));
  if(leaderSession) document.body.classList.add('leader-mode');
  buildNav();
  renderHeader();
  renderPage();
  document.getElementById('hiddenImport').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''});
  document.getElementById('hiddenGroupExcelImport').addEventListener('change', e => {
    if(e.target.files[0]) handleGroupExcelFile(e.target);
  });
  document.getElementById('hiddenGroupDocxImport').addEventListener('change', e => {
    if(e.target.files[0]) handleGroupDocxFile(e.target);
  });
  initFirebaseSync();
});
</script>
