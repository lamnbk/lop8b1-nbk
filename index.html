  <style>
    :root {
      --primary-color: #0d9488;
      --primary-dark: #0f766e;
      --primary-light: #ccfbf1;
      --secondary-color: #14b8a6;
      --accent-color: #5eead4;
      --success-color: #16a34a;
      --warning-color: #d97706;
      --danger-color: #dc2626;
      --text-color: #1f2937;
      --light-text: #6b7280;
      --border-color: #5eead4;
      --background-light: #f0fdfa;
      --shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.2);
      --teal-gradient: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #5eead4 100%);
      --teal-gradient-dark: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      --shadow-3d: 0 8px 32px rgba(13, 148, 136, 0.3);
      --sidebar-w: 248px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ccfbf1 0%, #99f6e4 50%, #5eead4 100%);
      min-height: 100vh;
      color: var(--text-color);
      overflow-x: hidden;
    }
    body::before, body::after { content:""; position: fixed; inset: auto; z-index:-1; filter: blur(10px); opacity:.55; }
    body::before { width:420px; height:420px; right:-160px; top:80px; background:#fb7185; border-radius:50%; }
    body::after { width:380px; height:380px; left:-160px; bottom:-70px; background:#38bdf8; border-radius:50%; }
    .app-shell { display:flex; min-height:100vh; padding:14px; gap:14px; }
    .sidebar {
      width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:rgba(255,255,255,.97); border:2px solid rgba(94,234,212,.75);
      border-radius:22px; box-shadow:var(--shadow-3d); padding:15px 12px; position:sticky; top:14px; height:calc(100vh - 28px); overflow-y:auto;
    }
    .brand { display:flex; align-items:center; gap:10px; padding:5px 8px 14px; border-bottom:1px solid #e5e7eb; margin-bottom:10px; }
    .brand-logo { width:48px; height:48px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(145deg,#0f766e,#2dd4bf); color:#fff; font-size:.95rem; font-weight:900; letter-spacing:-.04em; box-shadow:0 9px 24px rgba(13,148,136,.28); border:2px solid rgba(255,255,255,.85); overflow:hidden; }
    .brand-logo img { width:100%; height:100%; object-fit:cover; }
    .brand-copy { min-width:0; }
    .brand-name { font-weight:900; font-size:1.08rem; line-height:1.08; color:#0f766e; letter-spacing:-.02em; }
    .brand-subtitle { display:block; margin-top:4px; font-size:.72rem; font-weight:650; color:#64748b; line-height:1.15; }
    .sidebar .nav-link { color:#475569; display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px; margin:3px 0; font-weight:650; transition:.25s; cursor:pointer; position:relative; }
    .sidebar .nav-link:hover { transform:translateX(3px); background:#f0fdfa; color:var(--primary-dark); }
    .sidebar .nav-link.active { color:#fff; background:var(--teal-gradient); box-shadow:0 8px 20px rgba(13,148,136,.25); }
    .sidebar .nav-link i { width:20px; text-align:center; }
    .mini-badge { margin-left:auto; font-size:.65rem; padding:3px 7px; border-radius:999px; font-weight:800; background:#fee2e2; color:#ef4444; }
    .mini-badge.new { background:#d1fae5; color:#047857; }
    .guide-btn { border:none; width:100%; border-radius:13px; padding:11px; background:linear-gradient(135deg,#fb923c,#fbbf24); color:white; font-weight:800; margin-top:8px; box-shadow:0 8px 18px rgba(245,158,11,.23); }
    .author-box { margin-top:12px; padding:12px; border-radius:14px; background:linear-gradient(135deg,#eff6ff,#ecfdf5); border:1px solid #bfdbfe; font-size:.78rem; }
    .main-wrap { flex:1; min-width:0; }
    .topbar { background:rgba(255,255,255,.96); backdrop-filter:blur(12px); border:2px solid rgba(94,234,212,.7); border-radius:22px; box-shadow:var(--shadow-3d); padding:13px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:14px; z-index:20; }
    .page-title h1 { margin:0; font-size:clamp(1.35rem,2.5vw,2rem); font-weight:900; letter-spacing:-.03em; }
    .page-title p { margin:2px 0 0; color:var(--light-text); font-size:.9rem; }
    .top-actions { display:flex; align-items:center; gap:10px; flex:1; justify-content:flex-end; min-width:0; }
    .class-select-stack { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:160px; }
    .class-select-label { font-size:.62rem; line-height:1; font-weight:900; letter-spacing:.04em; color:#0f766e; white-space:nowrap; }
    .teacher-auth-wrap { display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
    .teacher-auth-actions { display:flex; align-items:center; gap:5px; }
    .teacher-auth-actions .btn { padding:3px 8px !important; font-size:.70rem !important; line-height:1.2; border-radius:999px !important; box-shadow:none; }
    .teacher-auth-actions .btn i { font-size:.68rem; }
    @media(max-width:1100px){ .banner-students{width:110px;flex-basis:110px}.banner-students img{width:110px;height:64px}.class-select-stack{min-width:145px}.class-switcher{min-width:145px} }
    @media(max-width:900px){ .teacher-auth-wrap{align-items:flex-end}.teacher-auth-actions{justify-content:flex-end}.class-mini-logo{order:-2}.banner-students{display:none}.top-actions{gap:7px}.teacher-mini{min-width:145px}.teacher-mini strong{max-width:120px} }
    .save-pill { padding:3px 8px; border:1px solid #99f6e4; background:#ecfdf5; color:#047857; border-radius:999px; font-weight:800; font-size:.64rem; line-height:1.05; white-space:nowrap; }
    .class-switcher { min-width:160px; background:#f5f3ff; border:1px solid #ddd6fe; border-radius:15px; padding:6px 10px; font-weight:800; color:#5b21b6; }
    .banner-students { width:125px; height:72px; flex:0 0 125px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; pointer-events:none; order:-3; }
    .banner-students img { width:125px; height:72px; display:block; object-fit:contain; object-position:center bottom; }
    .teacher-mini { display:flex; align-items:center; gap:9px; min-width:170px; }
    .avatar { width:44px; height:44px; border-radius:14px; object-fit:cover; background:var(--teal-gradient); color:#fff; display:grid; place-items:center; font-weight:900; border:2px solid white; box-shadow:0 4px 12px rgba(0,0,0,.1); overflow:hidden; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .teacher-mini strong { display:block; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }
    .teacher-mini small { color:var(--light-text); }
    .class-mini-logo { width:42px; height:42px; border-radius:13px; border:2px solid #99f6e4; background:var(--teal-gradient); color:#fff; display:grid; place-items:center; overflow:hidden; flex:0 0 42px; box-shadow:0 5px 14px rgba(13,148,136,.18); cursor:pointer; font-weight:900; }
    .class-mini-logo img { width:100%; height:100%; object-fit:cover; }
    .class-mini-logo.locked { cursor:not-allowed; opacity:.82; }
    .auth-role-badge { display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:.76rem;font-weight:800; }
    .main-content { background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-radius:20px; box-shadow:var(--shadow-3d); margin-top:14px; padding:20px; min-height:calc(100vh - 115px); border:2px solid var(--border-color); }
    .card { border:2px solid rgba(94,234,212,.58); border-radius:20px; box-shadow:0 10px 30px rgba(13,148,136,.10); transition:all .35s ease; background:rgba(255,255,255,.97); }
    .card.hover-lift:hover { transform:translateY(-4px); box-shadow:0 18px 36px rgba(13,148,136,.20); border-color:var(--primary-color); }
    .card-header { border-radius:18px 18px 0 0 !important; font-weight:800; padding:1rem 1.2rem; background:var(--teal-gradient) !important; color:#fff !important; border:none !important; }
    .btn { border-radius:12px; font-weight:700; padding:.65rem 1rem; transition:.25s; box-shadow:0 3px 10px rgba(0,0,0,.06); }
    .btn:hover { transform:translateY(-1px); box-shadow:0 7px 18px rgba(0,0,0,.13); }
    .btn-primary { background:var(--teal-gradient); border-color:var(--primary-color); }
    .btn-primary:hover { background:var(--teal-gradient-dark); border-color:var(--primary-dark); }
    .btn-outline-primary { border:2px solid var(--primary-color); color:var(--primary-color); }
    .btn-outline-primary:hover { background:var(--teal-gradient); border-color:var(--primary-color); color:#fff; }
    .form-control,.form-select { border-radius:12px; border:2px solid #cbd5e1; transition:.2s; padding:10px 12px; background:#fff; }
    .form-control:focus,.form-select:focus { border-color:var(--primary-color); box-shadow:0 0 0 .2rem rgba(13,148,136,.17); }
    .section-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .section-head h2 { font-weight:900; margin:0; font-size:1.35rem; }
    .section-head p { color:var(--light-text); margin:3px 0 0; }
    .stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .stat-card { padding:17px; border-radius:18px; background:var(--teal-gradient); color:white; position:relative; overflow:hidden; min-height:116px; box-shadow:0 12px 26px rgba(13,148,136,.21); }
    .stat-card::after { content:""; position:absolute; width:90px; height:90px; right:-28px; top:-28px; border:18px solid rgba(255,255,255,.15); border-radius:50%; }
    .stat-card .value { font-size:1.8rem; font-weight:900; margin-top:8px; }
    .stat-card .label { font-size:.82rem; opacity:.92; font-weight:700; }
    .stat-card i { position:absolute; right:16px; bottom:13px; font-size:2.6rem; opacity:.22; }
    .grid-2 { display:grid; grid-template-columns:1.3fr .7fr; gap:14px; }
    .grid-equal { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .student-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .student-card { padding:14px; position:relative; }
    .student-top { display:flex; gap:12px; align-items:center; }
    .student-avatar { width:74px; height:74px; border-radius:18px; flex:0 0 74px; overflow:hidden; display:grid; place-items:center; font-weight:900; color:white; font-size:1.35rem; background:linear-gradient(135deg,#2dd4bf,#0ea5e9); box-shadow:0 6px 16px rgba(13,148,136,.2); }
    .student-avatar img { width:100%; height:100%; object-fit:cover; }
    .student-name { font-weight:900; font-size:1.05rem; }

    .coin-pill { display:inline-flex; gap:5px; align-items:center; margin-top:5px; color:#0f766e; background:#f0fdfa; border:1px solid #99f6e4; border-radius:999px; padding:4px 10px; font-weight:800; font-size:.82rem; cursor:pointer; transition:.2s; user-select:none; }
    .coin-pill:hover { transform:scale(1.05); filter:brightness(.96); box-shadow:0 2px 6px rgba(0,0,0,.1); }
    .coin-pill.negative { color:#b91c1c; background:#fee2e2; border-color:#fca5a5; }

    .student-actions { margin-top:12px; padding-top:10px; border-top:1px solid #e5e7eb; display:flex; gap:7px; flex-wrap:wrap; }
    .icon-btn { width:36px; height:36px; padding:0; display:grid; place-items:center; border-radius:10px; border:1px solid #d1d5db; background:white; color:#475569; }
    .plus-btn { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
    .minus-btn { background:#fff1f2; color:#be123c; border-color:#fecdd3; }
    .table { border-radius:15px; overflow:hidden; box-shadow:0 5px 15px rgba(13,148,136,.08); }
    .table thead th { background:var(--teal-gradient); color:white; border:none; font-weight:800; padding:12px; }
    .table tbody td { padding:11px 12px; border-color:#e2e8f0; vertical-align:middle; }
    .attendance-btn { border:1px solid #dbe3ea; padding:9px 10px; border-radius:12px; background:#ffffff; color:#475569; font-size:.84rem; font-weight:800; display:flex; align-items:center; justify-content:center; gap:7px; width:100%; }
    .attendance-btn:hover { transform:translateY(-1px); box-shadow:0 6px 14px rgba(15,23,42,.08); }
    .attendance-btn.present.active { background:#10b981; border-color:#10b981; color:#fff; }
    .attendance-btn.late.active { background:#f59e0b; border-color:#f59e0b; color:#fff; }
    .attendance-btn.excused.active { background:#3b82f6; border-color:#3b82f6; color:#fff; }
    .attendance-btn.unexcused.active { background:#ef4444; border-color:#ef4444; color:#fff; }
    .attendance-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .att-box { border-radius:15px; padding:12px; text-align:center; border:1px solid #e2e8f0; }
    .att-box strong { font-size:1.45rem; display:block; }
    .att-box.present{background:#ecfdf5;color:#047857}.att-box.late{background:#fffbeb;color:#b45309}.att-box.excused{background:#eff6ff;color:#1d4ed8}.att-box.unexcused{background:#fff1f2;color:#be123c}
    .mini-avatar { width:42px; height:42px; border-radius:12px; overflow:hidden; display:grid; place-items:center; background:var(--teal-gradient); color:#fff; font-weight:900; flex:0 0 42px; box-shadow:0 4px 10px rgba(13,148,136,.12); }
    .mini-avatar img { width:100%; height:100%; object-fit:cover; }
    .attendance-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; margin-top:14px; }
    .attendance-card { padding:14px; border:2px solid #d9fdf7; border-radius:20px; background:linear-gradient(135deg,#ffffff 0%,#f8fffe 100%); box-shadow:0 8px 24px rgba(13,148,136,.08); }
    .attendance-card-head { display:flex; gap:12px; align-items:center; }
    .attendance-stt { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:#e6fffa; color:#0f766e; font-weight:900; flex:0 0 30px; }
    .attendance-info { min-width:0; flex:1; }
    .attendance-name { font-weight:900; font-size:1.04rem; line-height:1.25; }
    .attendance-meta { font-size:.78rem; color:#64748b; margin-top:4px; }
    .status-pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 10px; font-size:.78rem; font-weight:800; margin-top:8px; }
    .status-pill.present { background:#ecfdf5; color:#047857; }
    .status-pill.late { background:#fffbeb; color:#b45309; }
    .status-pill.excused { background:#eff6ff; color:#1d4ed8; }
    .status-pill.unexcused { background:#fff1f2; color:#be123c; }
    .attendance-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
    .attendance-note { margin-top:10px; padding-top:10px; border-top:1px dashed #dbe7e9; font-size:.76rem; color:#64748b; }
    .board-wrap { background:#f8fafc; border-radius:18px; border:2px solid #cbd5e1; padding:16px; overflow:auto; }
    .class-board { min-width:680px; padding:16px; perspective:900px; }
    .class-board.mode-3d .seat-grid { transform:rotateX(16deg); transform-origin:top center; margin-top:8px; }
    .class-board.mode-3d .seat { box-shadow:0 12px 18px rgba(15,23,42,.13); transform:translateZ(8px); }
    .class-board.mode-3d .bench-card { box-shadow:0 12px 22px rgba(15,23,42,.15); transform:translateZ(8px); }
    .chalkboard { background:linear-gradient(135deg,#123a47,#0f4c5c); border:8px solid #9a6b3a; border-radius:12px; color:#fde68a; padding:17px; text-align:center; font-weight:900; letter-spacing:.08em; box-shadow:0 12px 24px rgba(15,23,42,.2); }
    .teacher-desk { width:230px; margin:18px auto 22px; padding:12px; text-align:center; border-radius:13px; background:#ede9fe; border:2px solid #c4b5fd; color:#6d28d9; font-weight:900; }
    .seat-grid { display:grid; gap:14px; align-items:start; }
    .seat-lane { background:#f1f5f9; border-radius:14px; padding:10px; display:grid; gap:10px; }
    .lane-label { text-align:center; background:var(--teal-gradient); color:white; font-weight:900; border-radius:999px; padding:5px 10px; }
    .seat { min-height:96px; border-radius:13px; border:2px dashed #cbd5e1; background:white; padding:8px; display:flex; align-items:center; gap:8px; position:relative; }
    .seat.filled { border-style:solid; border-color:#99f6e4; box-shadow:0 6px 14px rgba(13,148,136,.1); }
    .seat .mini-avatar { width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--teal-gradient);color:white;font-weight:900;overflow:hidden;flex:0 0 38px; }
    .seat .mini-avatar img{width:100%;height:100%;object-fit:cover}
    .seat small { color:#64748b; }

    .bench-card { background:white; border:2px solid #cbd5e1; border-radius:14px; padding:10px; box-shadow:0 4px 10px rgba(15,23,42,.05); }
    .bench-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed #cbd5e1; font-weight:800; color:#0f766e; font-size:.85rem; }
    .bench-slots { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .bench-slot { min-height:56px; border-radius:10px; border:2px dashed #cbd5e1; background:#f8fafc; padding:6px 8px; display:flex; align-items:center; gap:6px; cursor:pointer; transition:.2s; }
    .bench-slot:hover { border-color:var(--primary-color); background:#f0fdfa; }
    .bench-slot.filled { border-style:solid; border-color:#99f6e4; background:white; box-shadow:0 3px 8px rgba(13,148,136,.1); }
    .bench-slot .mini-avatar { width:32px; height:32px; flex:0 0 32px; border-radius:50%; font-size:.75rem; }
    .bench-slot .slot-title { font-size:.78rem; font-weight:800; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bench-slot .slot-empty { font-size:.74rem; color:#94a3b8; font-weight:700; }

    /* ===== SƠ ĐỒ LỚP: HIỂN THỊ TOÀN BỘ CHIỀU RỘNG ===== */
    .seating-full-width {
      display:block !important;
      width:100%;
      min-width:0;
    }
    .seating-full-width .board-wrap {
      width:100%;
      min-width:0;
      overflow:visible;
      box-sizing:border-box;
      padding:12px;
    }
    .seating-full-width .class-board {
      width:100%;
      min-width:0;
      box-sizing:border-box;
    }
    .seating-full-width .seat-grid {
      width:100%;
      min-width:0;
    }
    .seating-full-width .seat-lane {
      min-width:0;
      width:100%;
      box-sizing:border-box;
    }
    .seating-full-width .bench-card {
      min-width:0;
      width:100%;
      box-sizing:border-box;
    }
    .seating-full-width .bench-slots {
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
    .seating-full-width .bench-slot {
      min-width:0;
      min-height:60px;
      overflow:hidden;
    }
    .seating-full-width .bench-slot .slot-title {
      min-width:0;
      flex:1 1 auto;
      white-space:normal;
      overflow:visible;
      text-overflow:clip;
      overflow-wrap:anywhere;
      word-break:normal;
      line-height:1.22;
    }
    .seating-full-width .mini-avatar {
      flex:0 0 32px;
    }
    @media(max-width:900px){
      .seating-full-width .seat-grid {
        grid-template-columns:1fr !important;
      }
    }
    @media(max-width:600px){
      .seating-full-width .board-wrap{padding:6px}
      .seating-full-width .bench-slots{gap:6px}
      .seating-full-width .bench-slot{padding:5px 6px;min-height:58px}
      .seating-full-width .bench-slot .slot-title{font-size:.74rem}
    }

    .filter-chip-group { display:flex; flex-wrap:wrap; gap:6px; }
    .filter-chip { border:1px solid #cbd5e1; background:#fff; color:#475569; padding:5px 12px; border-radius:999px; font-size:.82rem; font-weight:700; cursor:pointer; transition:.2s; }
    .filter-chip:hover { border-color:var(--primary-color); color:var(--primary-color); }
    .filter-chip.active { background:var(--teal-gradient); color:#fff; border-color:var(--primary-color); box-shadow:0 2px 6px rgba(13,148,136,.25); }

    .timetable { overflow-x: auto; overflow-y: hidden; width: 100%; padding-bottom: 6px; }
    .timetable-grid { display:grid; grid-template-columns:110px repeat(6,minmax(140px,1fr)); gap:1px; background:#cbd5e1; border:1px solid #cbd5e1; min-width:960px; border-radius:14px; overflow:hidden; margin-left: 0; }
    .tt-cell { background:white; min-height:72px; padding:8px; }
    .tt-head { background:var(--teal-gradient); color:white; font-weight:900; display:flex;align-items:center;justify-content:center;min-height:50px; text-align: center; }
    .tt-time { background:#f0fdfa; font-weight:800; color:#0f766e; display:flex;flex-direction:column;justify-content:center;text-align:center; }
    .lesson { border-radius:10px; padding:7px; background:#ecfeff; border-left:4px solid #0d9488; font-size:.82rem; cursor:pointer; }
    .reward-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .reward-card { overflow:hidden; }
    .reward-visual { height:125px; display:grid; place-items:center; font-size:3.5rem; background:linear-gradient(135deg,#ecfdf5,#cffafe); }
    .reward-body { padding:14px; }
    .wheel-layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; }
    .wheel-card { padding:18px; position:relative; overflow:hidden; }
    .wheel-machine { width:min(520px,90vw); aspect-ratio:1/1; border-radius:50%; border:8px solid #14b8a6; margin:10px auto; position:relative; background:radial-gradient(circle,#f0fdfa 0,#ecfeff 55%,#ccfbf1 100%); box-shadow:inset 0 0 35px rgba(13,148,136,.15),0 20px 35px rgba(13,148,136,.2); overflow:hidden; }
    .wheel-machine::before { content:"✦"; position:absolute; inset:0; display:grid; place-items:center; font-size:5rem; color:#0d9488; opacity:.22; }
    .wheel-ball { position:absolute; width:58px; height:58px; border-radius:50%; border:3px solid white; box-shadow:0 4px 12px rgba(15,23,42,.25); display:grid; place-items:center; background:var(--teal-gradient); color:white; font-weight:900; overflow:hidden; transform:translate(-50%,-50%); transition:all 1.1s cubic-bezier(.2,.8,.2,1); }
    .wheel-ball img{width:100%;height:100%;object-fit:cover}
    .wheel-machine.spinning .wheel-ball { animation:orbit .72s linear infinite; }
    .wheel-machine.fx1.spinning .wheel-ball { animation:bounceBall .48s ease-in-out infinite alternate; }
    .wheel-machine.fx2.spinning .wheel-ball { animation:suckCenter .82s ease-in-out infinite; }
    .wheel-machine.fx3.spinning .wheel-ball { animation:flyOrbit .95s ease-in-out infinite alternate; }
    .wheel-machine.fx4.spinning .wheel-ball { animation:rainBall .85s ease-in infinite; }
    .wheel-machine.fx5.spinning { animation:stageGlow .5s ease-in-out infinite alternate; }
    .wheel-machine.fx5.spinning .wheel-ball { animation:spotlight .6s ease-in-out infinite alternate; }
    .wheel-machine.fx6.spinning .wheel-ball { animation:waveBall .7s ease-in-out infinite alternate; }
    @keyframes orbit { 0%{filter:hue-rotate(0)}50%{transform:translate(-50%,-50%) scale(1.12) rotate(180deg)}100%{filter:hue-rotate(360deg);transform:translate(-50%,-50%) rotate(360deg)} }
    @keyframes bounceBall { from{transform:translate(-50%,-50%) scale(.82)} to{transform:translate(-50%,-68%) scale(1.18)} }
    @keyframes suckCenter { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{left:50%;top:50%;transform:translate(-50%,-50%) scale(.72)} }
    @keyframes flyOrbit { from{transform:translate(-70%,-35%) rotate(-18deg)} to{transform:translate(-30%,-65%) rotate(18deg)} }
    @keyframes rainBall { 0%{transform:translate(-50%,-160%) scale(.85)} 65%{transform:translate(-50%,10%) scale(1.08)} 100%{transform:translate(-50%,-50%) scale(1)} }
    @keyframes stageGlow { from{box-shadow:inset 0 0 35px rgba(13,148,136,.15),0 20px 35px rgba(13,148,136,.2)} to{box-shadow:inset 0 0 70px rgba(251,191,36,.42),0 0 45px rgba(139,92,246,.4)} }
    @keyframes spotlight { from{filter:brightness(.75);transform:translate(-50%,-50%) scale(1.15)} to{filter:brightness(1.35);transform:translate(-50%,-50%) scale(1.15)} }
    @keyframes waveBall { from{transform:translate(-50%,-62%) rotate(-8deg)} to{transform:translate(-50%,-38%) rotate(8deg)} }
    .effect-chip { border:1px solid #cbd5e1; border-radius:999px; padding:7px 10px; background:#fff; font-size:.8rem; font-weight:800; cursor:pointer; }
    .effect-chip.active { background:var(--teal-gradient); color:white; border-color:#0d9488; }
    .history-list { max-height:280px; overflow:auto; }
    .history-item { padding:9px; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; gap:8px; font-size:.82rem; }
    .alert-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .class-alert { min-height:110px; border-radius:17px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-weight:900; cursor:pointer; border:2px solid transparent; transition:.2s; }
    .class-alert:hover { transform:scale(1.02); }
    .noise-meter { height:24px; border-radius:999px; background:#e2e8f0; overflow:hidden; }
    .noise-fill { height:100%; width:0; background:linear-gradient(90deg,#10b981,#f59e0b,#ef4444); transition:width .1s linear; }
    .quiet-timer { width:170px;height:170px;border-radius:50%;display:grid;place-items:center;margin:auto;background:radial-gradient(circle,#fff 55%,#f0fdfa);border:12px solid #ccfbf1;font-size:2rem;font-weight:900;color:#0f766e; }
    .countdown-layout { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr); gap:15px; }
    .countdown-ring { width:min(390px,80vw); aspect-ratio:1; margin:10px auto; border-radius:50%; padding:18px; background:conic-gradient(var(--timer-color,#0d9488) var(--progress,100%),#e2e8f0 0); box-shadow:0 14px 34px rgba(15,23,42,.12); }
    .countdown-inner { width:100%;height:100%;border-radius:50%;background:#1e293b;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center; }
    .countdown-time { font-size:clamp(2.3rem,7vw,4.5rem);font-weight:900;letter-spacing:.04em; }
    .preset-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:7px; }
    .preset { border:1px solid #cbd5e1;border-radius:10px;padding:8px 4px;background:white;font-size:.75rem;font-weight:800;cursor:pointer; }
    .link-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:13px; }
    .link-card { padding:14px; }
    .link-card .link-icon { width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#ccfbf1;color:#0f766e;font-size:1.25rem; }
    .rank-row { display:grid; grid-template-columns:34px 44px 1fr auto; gap:10px; align-items:center; padding:10px; border-bottom:1px solid #e5e7eb; }
    .rank-no { width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fef3c7;color:#b45309;font-weight:900; }
    .progress-thin { height:7px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin-top:4px; }
    .progress-thin > div { height:100%; background:var(--teal-gradient); }
    .setting-box { padding:16px; }
    .subject-chip { display:inline-flex;align-items:center;gap:5px;padding:7px 10px;margin:4px;border-radius:999px;background:#f0fdfa;border:1px solid #99f6e4;color:#0f766e;font-weight:700;font-size:.82rem; }
    .empty { padding:28px;text-align:center;color:#64748b; }
    .fab-mobile { display:none; }
    .fade-in { animation:fadeIn .35s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .modal-content { border-radius:20px; border:2px solid var(--border-color); box-shadow:var(--shadow-3d); }
    .modal-header { background:var(--teal-gradient); color:white; border-radius:18px 18px 0 0; padding:17px 22px; }
    .btn-close { filter:brightness(0) invert(1); }
    .swal2-popup { border-radius:22px !important; }
    .full-alert-overlay { position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.78);backdrop-filter:blur(8px);animation:fadeIn .2s; }
    .full-alert-card { width:min(640px,90vw); padding:45px 24px; border-radius:28px; text-align:center; color:white; box-shadow:0 30px 80px rgba(0,0,0,.3); }
    .full-alert-card .emoji { font-size:5rem; }
    .full-alert-card h2 { font-weight:900;font-size:2.5rem; }
    ::-webkit-scrollbar { width:8px;height:8px } ::-webkit-scrollbar-track{background:#f0fdfa} ::-webkit-scrollbar-thumb{background:linear-gradient(#0d9488,#5eead4);border-radius:4px}
    @media(max-width:1100px){ .stats-grid{grid-template-columns:repeat(2,1fr)} .wheel-layout,.countdown-layout,.grid-2{grid-template-columns:1fr} .teacher-mini{display:none} .class-switcher{min-width:120px} }
    @media(max-width:820px){
      .app-shell{padding:8px}.sidebar{position:fixed;left:8px;top:8px;bottom:8px;z-index:50;transform:translateX(-115%);transition:.25s;height:auto}.sidebar.open{transform:translateX(0)}
      .main-wrap{width:100%}.topbar{top:8px;padding:11px}.page-title p{display:none}.main-content{padding:13px}.top-actions .save-pill{display:none}.fab-mobile{display:grid;place-items:center;position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:var(--teal-gradient);color:white;border:none;z-index:60;box-shadow:var(--shadow-3d)}
      .grid-equal{grid-template-columns:1fr}.attendance-summary{grid-template-columns:repeat(2,1fr)} .preset-grid{grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:520px){ .class-mini-logo{width:38px;height:38px;flex-basis:38px}.top-actions{flex-wrap:wrap}.stats-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-actions{gap:6px}.class-switcher{width:105px;font-size:.76rem}.page-title h1{font-size:1.25rem}.student-grid{grid-template-columns:1fr}.alert-grid{grid-template-columns:1fr}.main-content{margin-top:9px}.attendance-grid{grid-template-columns:1fr}.attendance-card-head{gap:10px}.mini-avatar{width:38px;height:38px;flex-basis:38px}.attendance-actions{grid-template-columns:1fr 1fr}.attendance-btn{padding:8px 6px;font-size:.74rem} }
    @media print { body{background:white}.sidebar,.topbar,.no-print{display:none!important}.app-shell{padding:0}.main-content{border:none;box-shadow:none;margin:0}.main-wrap{width:100%} }
    .group-member-row{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;border-bottom:1px solid #eef2f7;font-size:.85rem;gap:8px}
    .group-member-row:last-child{border-bottom:none}
    .group-leader-badge{background:#fef3c7;color:#b45309;border:1px solid #fde68a;border-radius:8px;padding:1px 6px;font-size:.7rem;font-weight:800}
    body.leader-mode .class-switcher,body.leader-mode .teacher-mini,body.leader-mode .class-mini-logo,body.leader-mode .save-pill,body.leader-mode .guide-btn,body.leader-mode .author-box{display:none!important}
  
.group-expand-arrow{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface-2,#f1f5f9);font-size:14px;font-weight:700;transition:transform .15s ease}
.group-card-head:hover .group-expand-arrow{transform:scale(1.05)}
.group-member-name-link{cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}.group-member-name-link:hover{opacity:.8}

<script>
'use strict';
const STORAGE_KEY='lopHocVuiVeTeal_lop8B1_v3';

const firebaseConfig = {
  apiKey: "AIzaSyDq2DxzfurfZpDQq6d49QuQVTbJJpdJAKI",
  authDomain: "doanvanlam-95238.firebaseapp.com",
  databaseURL: "https://doanvanlam-95238-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "doanvanlam-95238",
  storageBucket: "doanvanlam-95238.firebasestorage.app",
  messagingSenderId: "359527127604",
  appId: "1:359527127604:web:754b1b472ebd46ba0f8861"
};
const FIREBASE_DB_PATH = 'classroom_8b1_v3';

let fbApp = null, fbDbRef = null, fbReady = false, fbLastPushedJSON = '';

function isFirebaseConfigured(){
  const vals = Object.values(firebaseConfig);
  return vals.every(v => typeof v === 'string' && v && !v.includes('DÁN_'));
}

function initFirebaseSync(){
  const pill = document.getElementById('savePill');
  if(!isFirebaseConfigured()){
    if(pill) pill.innerHTML = '<i class="fa-solid fa-circle-info me-1"></i>Chưa cấu hình máy chủ - chỉ lưu trên máy này';
    return;
  }
  try{
    fbApp = firebase.initializeApp(firebaseConfig);
    fbDbRef = firebase.database().ref(FIREBASE_DB_PATH);
  }catch(e){
    console.error('Lỗi khởi tạo Firebase:', e);
    if(pill) pill.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-1"></i>Chưa kết nối được máy chủ';
    return;
  }

  fbDbRef.on('value', snap => {
    const remote = snap.val();
    if(remote && remote.version && Array.isArray(remote.classes) && remote.classes.length>0){
      const remoteJSON = JSON.stringify(remote);
      if(remoteJSON === fbLastPushedJSON){
        fbReady = true;
        return;
      }
      if(!remote.classes.some(c=>c.id===remote.activeClassId)) remote.activeClassId = remote.classes[0].id;
      if(!remote.settingPassword) remote.settingPassword = 'admin8b1';
      if(!remote.adminPassword) remote.adminPassword = '123';
      
      if(!Array.isArray(remote.transactions)) remote.transactions = [];
      if(!Array.isArray(remote.students)) remote.students = [];
      if(!Array.isArray(remote.rewards)) remote.rewards = [];
      if(!Array.isArray(remote.redemptions)) remote.redemptions = [];
      if(!Array.isArray(remote.wheelHistory)) remote.wheelHistory = [];
      if(!Array.isArray(remote.dailyPhotos)) remote.dailyPhotos = [];
      if(!Array.isArray(remote.links)) remote.links = [];
      if(!Array.isArray(remote.subjects)) remote.subjects = SUBJECTS.slice();
      if(!remote.attendance) remote.attendance = {};
      if(!remote.seating) remote.seating = {};
      if(!remote.slotTimes) remote.slotTimes = {};
      if(!remote.groups || typeof remote.groups !== 'object') remote.groups = {};

      const localPage = state.currentPage;
      state = remote;
      state.currentPage = localPage || 'home';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      fbReady = true;
      buildNav(); renderHeader(); renderPage();
      if(pill) pill.innerHTML = '<i class="fa-solid fa-cloud-arrow-down me-1"></i>Đã đồng bộ '+nowTime();
    } else if(remote === null){
      fbReady = true;
      saveState(false);
    }
  }, err=>{
    console.error('Lỗi đồng bộ Firebase:', err);
    if(pill) pill.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-1"></i>Mất kết nối máy chủ, đang dùng bản lưu tạm trên máy';
  });
}

function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function nowTime(){return new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function initials(name){return (name||'?').split(/\s+/).filter(Boolean).slice(-2).map(x=>x[0]).join('').toUpperCase()}
function norm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim().toLowerCase()}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function getWeekOfMonth(dateObj){
  const firstDay = new Date(dateObj.getFullYear(), dateObj.getMonth(), 1).getDay();
  return Math.ceil((dateObj.getDate() + (firstDay === 0 ? 6 : firstDay - 1)) / 7);
}

}

function loadState(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(x && x.version && Array.isArray(x.classes) && x.classes.length>0){
      if(!x.classes.some(c=>c.id===x.activeClassId)) {
        x.activeClassId = x.classes[0].id;
      }
      if(!x.settingPassword) x.settingPassword = 'admin8b1';
      if(!x.adminPassword) x.adminPassword = '123';
      if(Array.isArray(x.classes)){ x.classes.forEach((c,i)=>{ if(c.teacherPassword===undefined) c.teacherPassword = i===0 ? x.adminPassword : ''; }); }
      
      if(!Array.isArray(x.transactions)) x.transactions = [];
      if(!Array.isArray(x.students)) x.students = [];
      if(!Array.isArray(x.rewards)) x.rewards = [];
      if(!Array.isArray(x.redemptions)) x.redemptions = [];
      if(!Array.isArray(x.wheelHistory)) x.wheelHistory = [];
      if(!Array.isArray(x.dailyPhotos)) x.dailyPhotos = [];
      if(!Array.isArray(x.links)) x.links = [];
      if(!Array.isArray(x.subjects)) x.subjects = SUBJECTS.slice();
      if(!x.attendance) x.attendance = {};
      if(!x.seating) x.seating = {};
      if(!x.slotTimes) x.slotTimes = {};
      if(!Array.isArray(x.wheelExcluded)) x.wheelExcluded = [];
      if(!x.groups || typeof x.groups !== 'object') x.groups = {};

      return x;
    }
    return defaultState();
  }catch(e){
    return defaultState();
  }
}

function saveState(show=true){
  const p=document.getElementById('savePill');
  try{
    const json = JSON.stringify(state);
    localStorage.setItem(STORAGE_KEY, json);

    const syncState = Object.assign({}, state);
    delete syncState.currentPage;
    const syncJSON = JSON.stringify(syncState);

    if(p) p.innerHTML='<i class="fa-solid fa-cloud-arrow-up fa-fade me-1"></i>Đang lưu...';

    if(fbDbRef){
      fbLastPushedJSON = syncJSON;
      fbDbRef.set(syncState).then(()=>{
        if(p) p.innerHTML='<i class="fa-solid fa-circle-check me-1"></i>Đã lưu '+nowTime();
      }).catch(err=>{
        console.error('Lỗi khi lưu lên Firebase:', err);
        if(p) p.innerHTML='<i class="fa-solid fa-triangle-exclamation me-1"></i>Lưu tạm trên máy, chưa lên được máy chủ';
        toast('Không kết nối được máy chủ dữ liệu. Đã lưu tạm trên máy này, hãy kiểm tra mạng và thử lại.', 'warning');
      });
    } else if(p){
      p.innerHTML='<i class="fa-solid fa-circle-check me-1"></i>Đã lưu '+nowTime()+' (chỉ trên máy này)';
    }
  }catch(err){
    console.error("Lỗi khi lưu localStorage:", err);
    toast("Lỗi bộ nhớ trình duyệt, không lưu được!", "error");
  }
}

async function verifySettingAccess(){
  if(isAdminRole()) return true;
  const now = Date.now();
  if(now < settingLockUntil){
    const minutesLeft = Math.ceil((settingLockUntil - now) / 60000);
    await Swal.fire({icon:'error',title:'Quản trị đang bị khóa',text:`Do nhập sai mật khẩu Quản trị quá 5 lần, vui lòng thử lại sau ${minutesLeft} phút nữa.`});
    return false;
  }
  const currentPass = state.settingPassword || 'admin8b1';
  const {value: enteredPass, isDismissed} = await Swal.fire({
    title:'🔐 Đăng nhập Quản trị cao nhất',
    html:`<p class="small text-muted mb-2">Tài khoản này mở Cài đặt, Dữ liệu, quản lý lớp và các quyền cao nhất.</p><button type="button" class="btn btn-sm btn-link p-0 text-decoration-none" onclick="recoverSettingPassword()"><i class="fa-solid fa-envelope me-1"></i>Quên mật khẩu?</button>`,
    input:'password', inputPlaceholder:'Nhập mật khẩu Quản trị cao nhất...',
    inputAttributes:{autocomplete:'current-password'}, showCancelButton:true,
    confirmButtonText:'Đăng nhập',cancelButtonText:'Hủy',confirmButtonColor:'#0d9488'
  });
  if(isDismissed) return false;
  if(enteredPass===currentPass){
    authSession={role:'admin',loginAt:Date.now()}; saveAuthSession(); isAdminUnlocked=true; updateAuthBtnUI();
    return true;
  }
  settingFailCount++;
  if(settingFailCount>=5){settingLockUntil=Date.now()+3600000;}
  Swal.fire({icon:'error',title:'Mật khẩu không chính xác',text:settingFailCount>=5?'Đã khóa Quản trị trong 1 giờ.':`Còn ${5-settingFailCount} lần thử.`});
  return false;
}

function logTransaction(studentId,amount,reason='Điều chỉnh điểm',subject='Ghi chung / Nề nếp'){
  const s=state.students.find(x=>x.id===studentId);
  if(!s)return;
  s.coins = (s.coins||0) + amount;
  state.transactions.unshift({
    id:uid('tx'),
    classId:s.classId,
    studentId,
    studentName:s.name,
    amount,
    reason,
    subject,
    time:new Date().toISOString()
  });
  saveState(false);
}

function getStudentCoinsByMonth(studentId, monthFilter){
  if(monthFilter === 'all') {
    const s = state.students.find(x=>x.id===studentId);
    return s ? (s.coins || 0) : 0;
  }
  const targetMonth = parseInt(monthFilter, 10);
  const txs = state.transactions.filter(x => {
    if(x.studentId !== studentId) return false;
    const d = new Date(x.time);
    return (d.getMonth() + 1) === targetMonth;
  });
  return txs.reduce((acc, cur) => acc + (cur.amount || 0), 0);
}

                <tr class="${isMinus?'table-danger-subtle':''}">

                    ${isMinus ? tx.amount : '+'+tx.amount}

                  <td class="text-center">
                    <button class="btn btn-sm btn-outline-primary p-1 px-2 me-1" title="Sửa (Cần mật khẩu GVCN)" onclick="editTransaction('${tx.id}', '${studentId}')">
                      <i class="fa-solid fa-pen"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger p-1 px-2" title="Xóa (Cần mật khẩu GVCN)" onclick="deleteTransaction('${tx.id}', '${studentId}')">

                    </button>
                  </td>
                </tr>

async function editTransaction(txId, studentId){
  const ok = await verifyAdminAccess();
  if(!ok) {
    if(studentId) viewStudentViolations(studentId);
    return;
  }

  const tx = state.transactions.find(x => x.id === txId);
  const s = state.students.find(x => x.id === (studentId || tx?.studentId));
  if(!tx || !s) return;

  const d = new Date(tx.time);
  const dateVal = d.toISOString().slice(0, 10);
  const isNegative = tx.amount < 0;
  const absAmount = Math.abs(tx.amount);

  const {value: v} = await Swal.fire({
    title: 'Sửa ghi nhận vi phạm / khen thưởng',
    html: `
      <div class="text-start">
        <label class="form-label fw-bold">Loại ghi nhận</label>
        <select id="editTxType" class="form-select">
          <option value="-1" ${isNegative?'selected':''}>🚨 Vi phạm nề nếp (Trừ điểm)</option>
          <option value="1" ${!isNegative?'selected':''}>🌟 Khen thưởng thi đua (Cộng điểm)</option>
        </select>

        <label class="form-label fw-bold mt-2">Số lượng điểm</label>
        <input id="editTxAmount" type="number" min="1" class="form-control" value="${absAmount}">

        <label class="form-label fw-bold mt-2">Ngày ghi nhận (để tính đúng tuần & tháng)</label>
        <input id="editTxDate" type="date" class="form-control" value="${dateVal}">

        <label class="form-label fw-bold mt-2">Môn / Nhóm nội dung</label>
        <select id="editTxSubject" class="form-select">
          ${state.subjects.map(sub => `<option ${sub===tx.subject?'selected':''}>${esc(sub)}</option>`).join('')}
        </select>

        <label class="form-label fw-bold mt-2">Lý do / Nội dung chi tiết</label>
        <input id="editTxReason" class="form-control" value="${esc(tx.reason || '')}">
      </div>
    `,
    showCancelButton: true,
    confirmButtonText: 'Lưu thay đổi',
    cancelButtonText: 'Hủy',
    preConfirm: () => {
      const type = parseInt(document.getElementById('editTxType').value, 10);
      const amt = parseInt(document.getElementById('editTxAmount').value, 10) || 1;
      const date = document.getElementById('editTxDate').value;
      const sub = document.getElementById('editTxSubject').value;
      const rsn = document.getElementById('editTxReason').value.trim();
      return {
        amount: type * amt,
        date,
        subject: sub,
        reason: rsn || (type < 0 ? 'Vi phạm nề nếp' : 'Khen thưởng thi đua')
      };
    }
  });

  if(!v) {
    if(state.currentPage === 'students') viewStudentViolations(studentId);
    return;
  }

  s.coins = (s.coins || 0) - tx.amount + v.amount;

  let newTime = new Date(tx.time);
  if(v.date){
    const parts = v.date.split('-');
    newTime.setFullYear(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }

  tx.amount = v.amount;
  tx.reason = v.reason;
  tx.subject = v.subject;
  tx.time = newTime.toISOString();

  saveState(false);
  renderPage();
  toast('Đã cập nhật lại ghi nhận thành công!');
  if(state.currentPage === 'students') {
    setTimeout(() => viewStudentViolations(studentId), 250);
  }
}

async function deleteTransaction(txId, studentId){
  const ok = await verifyAdminAccess();
  if(!ok) {
    if(studentId) viewStudentViolations(studentId);
    return;
  }

  const tx = state.transactions.find(x => x.id === txId);
  const s = state.students.find(x => x.id === (studentId || tx?.studentId));
  if(!tx || !s) return;

  const r = await Swal.fire({
    icon: 'warning',
    title: 'Xóa ghi nhận này?',
    html: `Bạn có chắc muốn xóa ghi nhận: <b>"${esc(tx.reason)}"</b> (${tx.amount > 0 ? '+'+tx.amount : tx.amount} điểm)?<br><small class="text-muted">Số điểm tương ứng sẽ được hoàn trả lại cho học sinh.</small>`,
    showCancelButton: true,
    confirmButtonText: 'Đồng ý xóa',
    cancelButtonText: 'Hủy',
    confirmButtonColor: '#dc2626'
  });

  if(!r.isConfirmed){
    if(state.currentPage === 'students') viewStudentViolations(studentId);
    return;
  }

  s.coins = (s.coins || 0) - tx.amount;
  state.transactions = state.transactions.filter(x => x.id !== txId);

  saveState(false);
  renderPage();
  toast('Đã xóa ghi nhận và cân đối lại điểm!');
  if(state.currentPage === 'students') {
    setTimeout(() => viewStudentViolations(studentId), 250);
  }
}

function exportWeeklyExcel(){
  let txs = state.transactions.filter(x => x.classId === state.activeClassId);

    txs = txs.filter(x => (new Date(x.time).getMonth() + 1) === parseInt(weeklyMonth, 10));

  if(weeklyWeek !== 'all'){
    txs = txs.filter(x => getWeekOfMonth(new Date(x.time)) === parseInt(weeklyWeek, 10));
  }

  const rows = txs.map((tx, i) => {
    const d = new Date(tx.time);
    return {
      'STT': i + 1,
      'Tuần': 'Tuần ' + getWeekOfMonth(d),
      'Tháng': 'Tháng ' + (d.getMonth() + 1),

      'Điểm': tx.amount
    };
  });

  downloadXlsx([['Nhat_ki_tuan', rows]], `nhat-ki-tuan-${activeClass().name}-T${weeklyMonth}-W${weeklyWeek}.xlsx`);

async function saveStudent(e,id){
  e.preventDefault();
  let avatar=document.getElementById('sAvatarOld').value;
  const f=document.getElementById('sAvatar').files[0];
  if(f)avatar=await readFileData(f);
  const d={name:document.getElementById('sName').value.trim(),gender:document.getElementById('sGender').value,coins:+document.getElementById('sCoins').value||0,avatar,note:document.getElementById('sNote').value.trim(),favorite:document.getElementById('sFav').checked};
  if(id)Object.assign(state.students.find(x=>x.id===id),d);
  else state.students.push({id:uid('s'),classId:state.activeClassId,...d});
  saveState();
  mainModal.hide();
  buildNav();
  renderHeader();
  renderPage();
  toast('Đã lưu học sinh');
}

function readFileData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

async function deleteStudent(id){
  const ok = await verifyAdminAccess();
  if(!ok) return;

  const s=state.students.find(x=>x.id===id);

  state.students=state.students.filter(x=>x.id!==id);

async function handleStudentExcelFile(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  const ok = await verifyAdminAccess();
  if(!ok) return;

  try {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, {type:'array'});
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];
    const rows = XLSX.utils.sheet_to_json(worksheet, {header:1, defval:''});

    if(!rows || rows.length < 2){
      return Swal.fire({icon:'error', title:'Tệp trống hoặc sai định dạng', text:'File cần có dòng tiêu đề và ít nhất 1 học sinh.'});
    }

    let headerRowIdx = -1;
    let colName = -1, colGender = -1, colStt = -1;

    for(let r=0; r<Math.min(rows.length, 10); r++){
      const row = rows[r].map(c=>String(c).trim().toLowerCase());
      for(let c=0; c<row.length; c++){
        const text = row[c];
        if(colName === -1 && (text.includes('họ và tên') || text.includes('họ tên') || text.includes('họ và tên học sinh') || text === 'tên' || text.includes('học sinh'))){
          colName = c;
        }
        if(colGender === -1 && (text.includes('giới tính') || text.includes('phái') || text === 'nam/nữ' || text === 'gt')){
          colGender = c;
        }
        if(colStt === -1 && (text === 'stt' || text.includes('thứ tự') || text.includes('số tt'))){
          colStt = c;
        }
      }
      if(colName !== -1){
        headerRowIdx = r;
        break;
      }
    }

    if(headerRowIdx === -1){
      headerRowIdx = 0;
      colStt = 0;
      colName = 1;
      colGender = 2;
    }

    const newStudents = [];
    for(let r = headerRowIdx + 1; r < rows.length; r++){
      const row = rows[r];
      const rawName = String(row[colName] || '').trim();
      if(!rawName || rawName.toLowerCase() === 'họ và tên') continue;

      let gender = colGender !== -1 ? String(row[colGender] || '').trim() : '';
      if(gender){
        const gLow = gender.toLowerCase();
        if(gLow === 'x' || gLow === 'nữ' || gLow === 'nu' || gLow === 'female' || gLow === 'f') gender = 'Nữ';
        else if(gLow === 'nam' || gLow === 'male' || gLow === 'm') gender = 'Nam';
        else gender = gender.charAt(0).toUpperCase() + gender.slice(1);
      }

      newStudents.push({
        id: uid('s'),
        classId: state.activeClassId,
        name: rawName,
        gender: gender || 'Nữ',
        coins: 0,
        avatar: '',
        favorite: false,
        note: ''
      });
    }

    if(!newStudents.length){
      return Swal.fire({icon:'warning', title:'Không tìm thấy dữ liệu', text:'Không quét được danh sách học sinh từ file. Hãy kiểm tra lại các cột.'});
    }

    const {isConfirmed} = await Swal.fire({
      title: `Nhập ${newStudents.length} học sinh?`,
      html: `<div class="text-start small">
        <p>Đã tìm thấy <b>${newStudents.length}</b> học sinh từ tệp <b>${esc(file.name)}</b>.</p>
        <div class="border rounded p-2 bg-light mb-3" style="max-height:160px;overflow-y:auto">
          ${newStudents.slice(0, 8).map((s, idx)=>`<div>${idx+1}. ${esc(s.name)} - <i>${esc(s.gender)}</i></div>`).join('')}
          ${newStudents.length > 8 ? `<div class="text-muted">... và ${newStudents.length - 8} học sinh khác</div>`:''}
        </div>
        <p class="mb-0">Bạn muốn <b>thêm nối tiếp</b> vào danh sách hiện tại hay <b>thay thế toàn bộ</b> danh sách của lớp?</p>
      </div>`,
      showCancelButton: true,
      showDenyButton: true,
      confirmButtonText: '<i class="fa-solid fa-plus me-1"></i>Thêm nối tiếp',
      denyButtonText: '<i class="fa-solid fa-rotate me-1"></i>Thay thế danh sách cũ',
      cancelButtonText: 'Hủy'
    });

    if(isConfirmed){
      state.students.push(...newStudents);
    } else if(Swal.getDenyButton() && Swal.isVisible() && !isConfirmed) {
      const ok = await verifyAdminAccess();
      if(!ok) return;
      state.students = state.students.filter(s=>s.classId !== state.activeClassId).concat(newStudents);
      if(state.seating[state.activeClassId]) state.seating[state.activeClassId].assignments = {};
    } else {
      return;
    }

    saveState();
    buildNav();
    renderHeader();
    renderPage();
    toast(`Đã nhận ${newStudents.length} học sinh thành công!`);
  } catch(err){
    Swal.fire({icon:'error', title:'Lỗi đọc tệp', text: err.message});
  }
}

function renderAttendance(){const ss=classStudents(),date=document.getElementById('attDate')?.value||state.attendanceDate||today(),att=state.attendance[state.activeClassId+'_'+date]||{};return `<div class="section-head"><div><h2><i class="fa-solid fa-clipboard-check text-primary me-2"></i>Điểm danh lớp ${esc(activeClass().name)}</h2><p>Ảnh học sinh cạnh tên đã được thu nhỏ lại để không che bố cục. Bấm nhanh vào 1 trong 4 trạng thái cho từng em.</p></div><div class="d-flex gap-2 flex-wrap"><input id="attDate" type="date" class="form-control" style="width:160px" value="${date}" onchange="changeAttendanceDate(this.value)"><button class="btn btn-outline-primary" onclick="exportAttendance()"><i class="fa-solid fa-file-excel me-1"></i>Xuất Excel</button><button class="btn btn-primary" onclick="saveAttendanceSec()"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu điểm danh</button></div></div>${attendanceSummary(att,ss)}<div class="card p-3 mt-3"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><div><div class="fw-bold text-primary">Danh sách điểm danh</div><div class="small text-muted">Ảnh cạnh tên là avatar nhỏ, không còn bị phóng lớn như trước.</div></div><div class="small text-muted">Sĩ số: <strong>${ss.length}</strong> học sinh</div></div><div class="attendance-grid">${ss.map((s,i)=>{const st=att[s.id]||'present';const info=attendanceStatusInfo(st);return `<div class="attendance-card"><div class="attendance-card-head"><div class="attendance-stt">${i+1}</div>${renderAvatar(s,'mini-avatar')}<div class="attendance-info"><div class="attendance-name">${esc(s.name)}</div><div class="attendance-meta">${esc(activeClass().name)}${s.gender?` · ${esc(s.gender)}`:''}</div><div class="status-pill ${st}"><i class="fa-solid ${info.icon}"></i>${info.label}</div></div></div><div class="attendance-actions">${[['present','Có mặt','fa-circle-check'],['late','Đi muộn','fa-clock'],['excused','Có phép','fa-envelope-open-text'],['unexcused','Không phép','fa-circle-xmark']].map(([k,l,icon])=>`<button class="attendance-btn ${k} ${st===k?'active':''}" onclick="setAttendance('${s.id}','${k}')"><i class="fa-solid ${icon}"></i>${l}</button>`).join('')}</div><div class="attendance-note">${s.note?esc(s.note):'Có thể thêm hoặc đổi ảnh học sinh ở mục Học sinh.'}</div></div>`}).join('')}</div></div>`}

/*
 * NHẬP SƠ ĐỒ CHỖ NGỒI TỪ EXCEL
 * Hỗ trợ bố cục giống file:
 * - Dãy 1 ở A:D, Dãy 2 ở G:J
 * - Mỗi "Bàn n" có 4 tên ở hàng ngay trên hoặc ngay dưới
 * - Hỗ trợ cả thứ tự Bàn 1 -> Bàn 6/7 và Bàn 6 -> Bàn 1
 * - Ô "Để trống"/"Trống" được bỏ qua
 */
async function handleSeatingExcelFile(input){
  const file=input.files[0]; input.value=''; if(!file) return;
  const ok=await verifyAdminAccess(); if(!ok) return;
  try{
    const data=await file.arrayBuffer();
    const workbook=XLSX.read(data,{type:'array'});
    if(!workbook.SheetNames.length) throw new Error('Không có trang tính trong file Excel.');
    const norm=v=>String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
    const empty=v=>{const x=norm(v);return !x||['-','—','trống','để trống','de trong','empty','blank'].includes(x)};
    const benchRe=/^bàn\s*(\d+)$/i;
    let structured=null, visual=null;

    // Ưu tiên mẫu chuẩn: Dãy | Bàn | Ghế 1 | Ghế 2 | Ghế 3 | Ghế 4
    for(const sheetName of workbook.SheetNames){
      const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{header:1,defval:''});
      for(let r=0;r<Math.min(rows.length,12);r++){
        const h=(rows[r]||[]).map(norm);
        const hasLane=h.some(x=>x==='dãy'||x.includes('dãy'));
        const hasBench=h.some(x=>x==='bàn'||x.includes('bàn'));
        const seatCount=h.filter(x=>/^ghế\s*[1-4]$/.test(x)||/^cho\s*[1-4]$/.test(x)).length;
        if(hasLane&&hasBench&&seatCount>=2){structured={sheetName,rows,header:r};break;}
      }
      if(structured) break;
    }

    if(structured){
      const h=structured.rows[structured.header].map(norm);
      const findCol=(tests)=>{for(let i=0;i<h.length;i++) if(tests.some(t=>t(h[i]))) return i; return -1;};
      const cLane=findCol([x=>x==='dãy',x=>x.includes('dãy')]);
      const cBench=findCol([x=>x==='bàn',x=>x.includes('bàn')]);
      const cSeats=[1,2,3,4].map(n=>findCol([x=>x===`ghế ${n}`,x=>x===`cho ${n}`,x=>x===`chỗ ${n}`]));
      const extracted=[];
      for(let r=structured.header+1;r<structured.rows.length;r++){
        const row=structured.rows[r]||[]; const laneRaw=String(row[cLane]??'').trim(); const benchRaw=String(row[cBench]??'').trim();
        const lm=laneRaw.match(/(\d+)/); const bm=benchRaw.match(/(\d+)/);
        if(!lm||!bm) continue;
        const lane=parseInt(lm[1],10), bench=parseInt(bm[1],10);
        if(![1,2].includes(lane)||bench<1||bench>7) continue;
        extracted.push({lane,bench,names:cSeats.map(c=>c<0?'':(empty(row[c])?'':String(row[c]).trim()))});
      }
      if(extracted.length) visual={sheetName:structured.sheetName,extracted,format:'structured'};
    }

    // Hỗ trợ luôn file sơ đồ trực quan hiện tại của thầy: hai cụm A:D và G:J,
    // nhãn Bàn n có 4 tên ở hàng ngay trên hoặc ngay dưới.
    if(!visual){
      for(const sheetName of workbook.SheetNames){
        const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{header:1,defval:''});
        const maxCols=Math.max(...rows.map(r=>r.length),0);
        const benchCols=[];
        for(let c=0;c<maxCols;c++){
          let count=0; for(const row of rows) if(benchRe.test(String(row?.[c]??'').trim())) count++;
          if(count) benchCols.push({c,count});
        }
        if(benchCols.length<2) continue;
        const starts=benchCols.sort((a,b)=>a.c-b.c).slice(0,2).map(x=>x.c);
        const groups=starts.map(c=>({start:c,end:c+3}));
        const extracted=[];
        groups.forEach((g,gi)=>{
          for(let r=0;r<rows.length;r++){
            const m=String(rows[r]?.[g.start]??'').trim().match(benchRe); if(!m) continue;
            const bench=parseInt(m[1],10); if(bench<1||bench>7) continue;
            let bestRow=-1,bestCount=-1;
            for(const rr of [r-1,r+1]){
              if(rr<0||rr>=rows.length) continue;
              let count=0; for(let c=g.start;c<=g.end;c++){const v=rows[rr]?.[c]; if(!empty(v)&&!benchRe.test(String(v??'').trim())) count++;}
              if(count>bestCount){bestCount=count;bestRow=rr;}
            }
            const names=[0,1,2,3].map(k=>bestRow>=0&&!empty(rows[bestRow]?.[g.start+k])?String(rows[bestRow][g.start+k]).trim():'');
            extracted.push({lane:gi+1,bench,names});
          }
        });
        const valid=extracted.filter(x=>x.names.some(Boolean));
        if(valid.length>=2){visual={sheetName,extracted:valid,format:'visual'};break;}
      }
    }
    if(!visual) throw new Error('Không tìm thấy mẫu sơ đồ. Hãy dùng file mẫu "Mau_Nhap_So_Do_Lop.xlsx".');

    const cfg=seatingCfg();
    const rowsPerLane=cfg.type==='2x7x4'?7:6;
    const students=classStudents();
    const byName=new Map();
    students.forEach(s=>{const k=norm(s.name);if(!byName.has(k))byName.set(k,[]);byName.get(k).push(s)});
    const used=new Set(), assignments={}, missing=[], imported=[];
    const findStudent=name=>(byName.get(norm(name))||[]).find(x=>!used.has(x.id));
    visual.extracted.forEach(item=>item.names.forEach((name,slot)=>{
      if(!name||item.lane>2||item.bench>rowsPerLane)return;
      const st=findStudent(name);
      if(!st){missing.push({name,lane:item.lane,bench:item.bench,slot:slot+1});return;}
      used.add(st.id); assignments[`${(item.lane-1)*rowsPerLane+(item.bench-1)}_${slot}`]=st.id; imported.push(st.name);
    }));
    const named=visual.extracted.flatMap(x=>x.names.filter(Boolean));
    const duplicates={}; named.forEach(n=>duplicates[norm(n)]=(duplicates[norm(n)]||0)+1);
    const dupList=Object.entries(duplicates).filter(([,n])=>n>1);
    const confirm=await Swal.fire({
      icon:missing.length?'warning':'question',title:'Nhập sơ đồ từ Excel?',
      html:`<div class="text-start small">
        <p><b>Trang:</b> ${esc(visual.sheetName)} · <b>Định dạng:</b> ${visual.format==='structured'?'Mẫu chuẩn':'Sơ đồ trực quan'}</p>
        <p><b>Loại sơ đồ đang chọn:</b> 2 dãy × ${rowsPerLane} bàn × 4 chỗ = <b>${rowsPerLane*2*4} chỗ</b></p>
        <p><b>Số tên trong Excel:</b> ${named.length} · <b>Khớp danh sách lớp:</b> ${imported.length}</p>
        ${missing.length?`<div class="alert alert-warning py-2"><b>${missing.length}</b> tên chưa có trong danh sách lớp:<br>${missing.slice(0,8).map(x=>`• ${esc(x.name)}`).join('<br>')}${missing.length>8?`<br>... và ${missing.length-8} tên khác`:''}</div>`:''}
        ${dupList.length?`<div class="alert alert-info py-2">Có ${dupList.length} tên xuất hiện nhiều lần. Chương trình chỉ gán mỗi học sinh một lần; lần trùng tiếp theo sẽ được bỏ qua nếu danh sách lớp không có học sinh trùng tên.</div>`:''}
        <p class="mb-0 text-danger"><b>Lưu ý:</b> Bàn 7 vẫn giữ nguyên vì thầy đang chọn 2×7×4. Nếu Excel chỉ có 6 bàn/dãy, Bàn 7 sẽ để trống.</p>
      </div>`,
      showCancelButton:true,confirmButtonText:'<i class="fa-solid fa-file-import me-1"></i>Nhập sơ đồ',cancelButtonText:'Hủy'
    });
    if(!confirm.isConfirmed)return;
    cfg.type=cfg.type==='2x7x4'?'2x7x4':'2x6x4'; cfg.lanes=2; cfg.seats=rowsPerLane*2; cfg.assignments=assignments;
    saveState();renderPage();
    Swal.fire({icon:missing.length?'warning':'success',title:missing.length?'Đã nhập sơ đồ':'Nhập sơ đồ thành công!',html:`Đã xếp <b>${imported.length}</b> học sinh. ${missing.length?`Còn <b>${missing.length}</b> tên chưa khớp.`:''}`,confirmButtonText:'Đóng'});
  }catch(err){console.error(err);Swal.fire({icon:'error',title:'Không thể nhập sơ đồ',text:err.message||String(err)});}
}

function renderSeating(){
  const cfg=seatingCfg(), ss=classStudents();
  if(!cfg.assignments) cfg.assignments={};

ctiveClass().name)} ★</span><br><small>Niên khóa: ${esc(activeClass().year)} · GVCN: ${esc(state.teacher.name)} · Sĩ số: ${ss.length} HS</small></div><div class="teacher-desk"><i class="fa-solid fa-desktop me-1"></i>BÀN GIÁO VIÊN<br><small>${esc(state.teacher.name)}</small></div>${isBenchLayout?renderBenchBoard(cfg,rowsPerLane):renderStandardBoard(cfg)}</div></div></div>`;

function renderBenchBoard(cfg, rowsPerLane){
  return `<div class="seat-grid" style="grid-template-columns:repeat(2,minmax(280px,1fr));gap:20px;">
    ${[0,1].map(laneIndex => `
      <div class="seat-lane">
        <div class="lane-label">📌 DÃY ${laneIndex+1} (${rowsPerLane} Bàn - 4 chỗ/bàn)</div>
        ${Array.from({length:rowsPerLane},(_,row)=>benchHtml(laneIndex, row, rowsPerLane, cfg)).join('')}
      </div>
    `).join('')}
  </div>`;
}

function benchHtml(lane, row, rowsPerLane, cfg){
  const benchIdx = lane * rowsPerLane + row;
  const benchNum = row + 1;
  return `
    <div class="bench-card">
      <div class="bench-header">
        <span><i class="fa-solid fa-chalkboard-user me-1 text-primary"></i>Dãy ${lane+1} · Bàn ${benchNum}</span>
        <span class="badge bg-light text-dark">4 Chỗ</span>
      </div>
      <div class="bench-slots">
        ${[0,1,2,3].map(slot => benchSlotHtml(benchIdx, slot, cfg)).join('')}
      </div>
    </div>
  `;
}

function benchSlotHtml(benchIdx, slot, cfg){
  const key = `${benchIdx}_${slot}`;
  const sid = cfg.assignments[key];
  const s = state.students.find(x=>x.id===sid);
  return `
    <div class="bench-slot ${s?'filled':''}" onclick="chooseBenchSeat('${key}','Bàn ${(benchIdx % (cfg.type==='2x7x4'?7:6)) + 1}, Ghế ${slot+1}')">
      ${s ? `
        ${renderAvatar(s,'mini-avatar')}
        <div class="slot-title" title="${esc(s.name)}">${esc(s.name)}</div>
      ` : `
        <div class="slot-empty"><i class="fa-solid fa-plus me-1"></i>Ghế ${slot+1} (Trống)</div>
      `}
    </div>
  `;
}

function renderStandardBoard(cfg){
  const lanes = cfg.lanes || 2;
  const seats = cfg.seats || 14;
  return `<div class="seat-grid" style="grid-template-columns:repeat(${lanes},minmax(130px,1fr))">
    ${Array.from({length:lanes},(_,laneIndex)=>`

function timeSlots(){
  const t=[];
  const defaultSm=['07:30 - 08:05','08:15 - 08:50','09:05 - 09:40','09:50 - 10:25','10:35 - 11:10','11:15 - 11:50'];
  const defaultCh=['13:30 - 14:05','14:15 - 14:50','15:05 - 15:40','15:50 - 16:25','16:35 - 17:10'];
  if(!state.slotTimes) state.slotTimes = {};

  if(state.timetable.morning){
    for(let i=0;i<state.timetable.morningCount;i++){
      const id = 'S'+(i+1);
      const timeVal = state.slotTimes[id] !== undefined ? state.slotTimes[id] : (defaultSm[i] || '');
      t.push({id, label:'Tiết '+(i+1)+' Sáng', time: timeVal});
    }
  }
  if(state.timetable.afternoon){
    for(let i=0;i<state.timetable.afternoonCount;i++){
      const id = 'C'+(i+1);
      const timeVal = state.slotTimes[id] !== undefined ? state.slotTimes[id] : (defaultCh[i] || '');
      t.push({id, label:'Tiết '+(i+1)+' Chiều', time: timeVal});
    }
  }
  return t;
}

async function handleTimetableExcelFile(input){
  const file=input.files[0]; input.value=''; if(!file)return;
  const ok=await verifyAdminAccess(); if(!ok)return;
  try{
    const data=await file.arrayBuffer(), wb=XLSX.read(data,{type:'array'});
    const norm=v=>String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
    const dayMap={'thứ hai':0,'thu hai':0,'thứ 2':0,'thu 2':0,'2':0,'thứ ba':1,'thu ba':1,'thứ 3':1,'thu 3':1,'3':1,'thứ tư':2,'thu tu':2,'thứ 4':2,'thu 4':2,'4':2,'thứ năm':3,'thu nam':3,'thứ 5':3,'thu 5':3,'5':3,'thứ sáu':4,'thu sau':4,'thứ 6':4,'thu 6':4,'6':4,'thứ bảy':5,'thu bay':5,'thứ 7':5,'thu 7':5,'7':5};
    let best=null;
    for(const sheetName of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''});
      for(let r=0;r<Math.min(rows.length,15);r++){
        const h=(rows[r]||[]).map(norm);
        const hasDay=h.some(x=>x==='ngày'||x==='thứ'||x.includes('ngày')||x.includes('thứ'));
        const hasSlot=h.some(x=>x==='tiết'||x.includes('tiết'));
        const hasSubject=h.some(x=>x.includes('môn')||x.includes('học')||x==='subject');
        if(hasDay&&hasSlot&&hasSubject){best={sheetName,rows,header:r};break;}
      }
      if(best)break;
    }
    if(!best)throw new Error('Không tìm thấy bảng TKB. Hãy dùng file mẫu "Mau_Nhap_TKB.xlsx".');
    const h=best.rows[best.header].map(norm);
    const col=tests=>{for(let i=0;i<h.length;i++)if(tests.some(t=>t(h[i])))return i;return -1};
    const cDay=col([x=>x==='thứ',x=>x==='ngày',x=>x.includes('thứ'),x=>x.includes('ngày')]);
    const cSlot=col([x=>x==='tiết',x=>x.includes('tiết')]);
    const cSession=col([x=>x==='buổi',x=>x.includes('buổi')]);
    const cSub=col([x=>x.includes('môn'),x=>x.includes('nội dung'),x==='subject']);
    const cTeacher=col([x=>x.includes('giáo viên'),x==='gv',x.includes('teacher')]);
    const cTime=col([x=>x.includes('thời gian'),x==='giờ',x==='giờ học',x==='time']);
    const cClass=col([x=>x==='lớp',x.includes('lớp')]);
    const rows=[];
    for(let r=best.header+1;r<best.rows.length;r++){
      const row=best.rows[r]||[]; const sub=String(row[cSub]??'').trim(); if(!sub)continue;
      const classVal=cClass>=0?String(row[cClass]??'').trim():''; if(classVal && norm(classVal)!==norm(activeClass().name))continue;
      const dRaw=norm(row[cDay]); const day=dayMap[dRaw]!==undefined?dayMap[dRaw]:dayMap[(dRaw.match(/\d+/)||[])[0]]; if(day===undefined)continue;
      const slotRaw=String(row[cSlot]??'').trim(); const sn=(slotRaw.match(/\d+/)||[])[0]; if(!sn)continue;
      let session=cSession>=0?norm(row[cSession]):''; let prefix=session.includes('chiều')||session.includes('chieu')||session==='c'?'C':'S';
      const slotId=prefix+parseInt(sn,10); const teacher=cTeacher>=0?String(row[cTeacher]??'').trim():''; const time=cTime>=0?String(row[cTime]??'').trim():'';
      rows.push({day,slot:slotId,subject:sub,teacher,time});
    }
    if(!rows.length)throw new Error('Không đọc được dòng TKB hợp lệ. Kiểm tra cột Ngày/Thứ, Buổi, Tiết, Môn học.');
    const seen=new Set(), clean=[]; rows.forEach(x=>{const k=x.day+'|'+x.slot;if(!seen.has(k)){seen.add(k);clean.push(x)}else{const i=clean.findIndex(y=>y.day===x.day&&y.slot===x.slot);clean[i]=x;}});
    const preview=clean.slice(0,10).map((x,i)=>`${i+1}. ${DAYS[x.day]} · ${x.slot}: <b>${esc(x.subject)}</b>${x.teacher?' · '+esc(x.teacher):''}`).join('<br>');
    const result=await Swal.fire({title:'Nhập thời khóa biểu từ Excel?',html:`<div class="text-start small"><p><b>Trang:</b> ${esc(best.sheetName)} · <b>Số tiết:</b> ${clean.length}</p><div class="border rounded p-2 bg-light" style="max-height:180px;overflow:auto">${preview}${clean.length>10?`<br>... và ${clean.length-10} tiết khác`:''}</div><p class="mt-2 mb-0 text-danger"><b>Lưu ý:</b> Các tiết TKB của lớp hiện tại sẽ được thay bằng dữ liệu trong Excel. Giờ học trong cột Thời gian (nếu có) cũng được cập nhật.</p></div>`,showCancelButton:true,confirmButtonText:'<i class="fa-solid fa-file-import me-1"></i>Nhập TKB',cancelButtonText:'Hủy'});
    if(!result.isConfirmed)return;
    state.timetable.entries=state.timetable.entries.filter(x=>x.classId!==state.activeClassId);
    clean.forEach(x=>state.timetable.entries.push({id:uid('tt'),classId:state.activeClassId,day:x.day,slot:x.slot,subject:x.subject,teacher:x.teacher}));
    if(!state.slotTimes)state.slotTimes={}; clean.forEach(x=>{if(x.time)state.slotTimes[x.slot]=x.time});
    const maxS=Math.max(0,...clean.filter(x=>x.slot[0]==='S').map(x=>parseInt(x.slot.slice(1),10))); const maxC=Math.max(0,...clean.filter(x=>x.slot[0]==='C').map(x=>parseInt(x.slot.slice(1),10)));
    if(maxS)state.timetable.morning=true,state.timetable.morningCount=Math.min(6,Math.max(state.timetable.morningCount||5,maxS));
    if(maxC)state.timetable.afternoon=true,state.timetable.afternoonCount=Math.min(5,Math.max(state.timetable.afternoonCount||4,maxC));
    saveState();renderPage();toast(`Đã nhập ${clean.length} tiết TKB thành công!`);
  }catch(err){console.error(err);Swal.fire({icon:'error',title:'Không thể nhập TKB',text:err.message||String(err)});}
}

function ensureGroupsForClass(){

  if(!state.groups || typeof state.groups !== 'object' || Array.isArray(state.groups)) state.groups = {};
  const classId = state.activeClassId;
  if(!state.groups[classId] || typeof state.groups[classId] !== 'object') state.groups[classId] = {count:0, teams:[]};
  const g = state.groups[classId];
  if(!Array.isArray(g.teams)) g.teams = [];
  g.teams = g.teams.filter(Boolean).map((team,i)=>({
    id: team.id || uid('team'),
    name: team.name || ('Tổ '+(i+1)),
    studentIds: Array.isArray(team.studentIds) ? team.studentIds : [],
    leaderId: team.leaderId || '',
    leaderPassword: team.leaderPassword || ''

  g.count = Number.isFinite(Number(g.count)) ? Number(g.count) : g.teams.length;

async function handleGroupExcelFile(input){
  const file = input.files[0]; const teamId = input.dataset.teamId; input.value = '';
  if(!file) return;
  try{
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, {type:'array'});
    const ws = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    const names = extractNamesFromRows(rows);
    if(!names.length) return Swal.fire({icon:'warning', title:'Không tìm thấy tên học sinh trong tệp'});
    confirmGroupImport(teamId, names);
  }catch(err){
    Swal.fire({icon:'error', title:'Lỗi đọc tệp Excel', text: err.message});
  }
}

function extractNamesFromRows(rows){
  let headerRowIdx=-1, colName=-1;
  for(let r=0; r<Math.min(rows.length,10); r++){
    const row=(rows[r]||[]).map(c=>String(c).trim().toLowerCase());
    for(let c=0;c<row.length;c++){
      const text=row[c];
      if(colName===-1 && (text.includes('họ và tên')||text.includes('họ tên')||text==='tên'||text.includes('học sinh'))) colName=c;
    }
    if(colName!==-1){ headerRowIdx=r; break; }
  }
  if(headerRowIdx===-1){ headerRowIdx=-1; colName=0; }
  const names=[];
  for(let r=headerRowIdx+1; r<rows.length; r++){
    const raw=String((rows[r]||[])[colName]||'').trim();
    if(raw) names.push(raw);
  }
  return names;
}

async function handleGroupDocxFile(input){
  const file = input.files[0]; const teamId = input.dataset.teamId; input.value = '';
  if(!file) return;
  if(typeof mammoth === 'undefined'){
    return Swal.fire({icon:'error', title:'Chưa tải được công cụ đọc file Word', text:'Vui lòng kiểm tra kết nối mạng rồi thử lại, hoặc dùng cách Nhập tay / Dán danh sách.'});
  }
  try{
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer});
    const names = (result.value||'').split(/\r?\n/).map(x=>x.trim()).filter(x=>x && !/^(stt|danh sách|họ và tên|họ tên|tổ)\W*$/i.test(x));
    if(!names.length) return Swal.fire({icon:'warning', title:'Không tìm thấy tên học sinh trong tệp Word'});
    confirmGroupImport(teamId, names);
  }catch(err){
    Swal.fire({icon:'error', title:'Lỗi đọc tệp Word', text: err.message});
  }
}

async function confirmGroupImport(teamId, rawNames){
  const names = [...new Set(rawNames.map(x=>x.trim()).filter(Boolean))];
  if(!names.length) return;
  const g = currentGroupData();
  const team = g.teams.find(t=>t.id===teamId);
  if(!team) return;
  const {isConfirmed, isDenied} = await Swal.fire({
    title:`Nhập ${names.length} học sinh vào ${team.name}?`,
    html:`<div class="text-start small"><div class="border rounded p-2 bg-light mb-3" style="max-height:160px;overflow-y:auto">${names.slice(0,10).map((n,i)=>`<div>${i+1}. ${esc(n)}</div>`).join('')}${names.length>10?`<div class="text-muted">... và ${names.length-10} học sinh khác</div>`:''}</div><p class="mb-0">Thêm nối tiếp vào danh sách tổ hiện tại hay thay thế toàn bộ?</p></div>`,
    showCancelButton:true, showDenyButton:true,
    confirmButtonText:'Thêm nối tiếp', denyButtonText:'Thay thế danh sách tổ', cancelButtonText:'Hủy'
  });
  if(!isConfirmed && !isDenied) return;
  const ok = await verifyAdminAccess();
  if(!ok) return;
  await applyGroupImport(team, names, isDenied ? 'replace' : 'append');
}

async function applyGroupImport(team, names, mode){
  const ok = await verifyAdminAccess();
  if(!ok) return;
  if(mode==='replace') team.studentIds = [];
  names.forEach(name=>{
    let s = classStudents().find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
    if(!s){
      s = {id:uid('s'), classId:state.activeClassId, name, gender:'Nữ', coins:0, avatar:'', favorite:false, note:''};
      state.students.push(s);
    }
    (currentGroupData().teams||[]).forEach(t=>{ if(t.id!==team.id) t.studentIds=t.studentIds.filter(id=>id!==s.id); });
    if(!team.studentIds.includes(s.id)) team.studentIds.push(s.id);
  });
  saveState(); buildNav(); renderHeader(); renderPage();
  toast(`Đã nhập danh sách vào ${team.name} thành công!`);
}

async function leaderAdjustCoins(id, sign){
  const s = state.students.find(x=>x.id===id);
  if(!s) return;
  const team = leaderTeamData();
  if(!team || !team.studentIds.includes(id)) return toast('Bạn chỉ có thể nhập điểm cho học sinh trong tổ của mình','warning');
  const {value:v} = await Swal.fire({
    title: sign>0 ? `🌟 Thưởng điểm cho ${s.name}` : `🚨 Trừ điểm của ${s.name}`,
    html:`<div class="text-start">
      <label class="form-label fw-bold">Số lượng điểm</label>
      <select id="coinAmount" class="form-select"><option value="1">1 điểm</option><option value="2">2 điểm</option><option value="3">3 điểm</option><option value="5">5 điểm</option></select>
      <label class="form-label fw-bold mt-3">Nội dung khen thưởng / kỷ luật</label>
      <input id="coinReason" class="form-control" required placeholder="${sign>0?'Ví dụ: Phát biểu tốt, giúp đỡ bạn...':'Ví dụ: Nói chuyện riêng, quên vở, vi phạm nề nếp...'}">
    </div>`,
    showCancelButton:true,
    confirmButtonText: sign>0 ? 'Xác nhận thưởng' : 'Xác nhận trừ điểm',
    cancelButtonText:'Hủy',
    confirmButtonColor: sign>0 ? '#0d9488' : '#dc2626',
    preConfirm:()=>({
      amount:+document.getElementById('coinAmount').value,
      reason:document.getElementById('coinReason').value || (sign>0?'Khen thưởng thi đua (Tổ trưởng)':'Vi phạm nề nếp (Tổ trưởng)')
    })
  });
  if(!v) return;
  logTransaction(id, sign*v.amount, v.reason, 'Ghi chung / Nề nếp');
  renderPage();
  toast(sign>0 ? `Đã cộng +${v.amount} điểm` : `Đã trừ -${v.amount} điểm`);
}

function openLeaderLogin(){
  Swal.fire({
    title:'🔑 Đăng nhập Tổ trưởng',
    html:`<p class="small text-muted mb-2">Nhập mã đăng nhập (Mật khẩu Lớp 3) do giáo viên cấp riêng cho tổ trưởng.</p>`,
    input:'password',
    inputAttributes:{autocomplete:'current-password'},
    inputPlaceholder:'Nhập mật khẩu tổ trưởng...',
    showCancelButton:true, confirmButtonText:'Đăng nhập', cancelButtonText:'Hủy'
  }).then(({value:code, isConfirmed})=>{
    if(!isConfirmed || !code) return;
    const trimmed = code.trim();
    let found = null;
    Object.keys(state.groups||{}).forEach(clsId=>{
      (state.groups[clsId].teams||[]).forEach(t=>{
        if(t.leaderPassword && t.leaderPassword === trimmed) found = {classId:clsId, teamId:t.id, leaderId:t.leaderId};
      });
    });
    if(!found){ return Swal.fire({icon:'error', title:'Mã đăng nhập không đúng'}); }
    authSession={role:'leader',loginAt:Date.now()}; saveAuthSession();
    enterLeaderMode(found);
    toast('Đăng nhập tổ trưởng thành công!');
  });
}

function enterLeaderMode(session){
  leaderSession = session;
  try{ sessionStorage.setItem('leaderSessionKey', JSON.stringify(session)); }catch(e){}
  document.body.classList.add('leader-mode');
  buildNav(); renderHeader(); renderPage();
}

function leaderLogout(){
  leaderSession = null;
  authSession = null; isAdminUnlocked=false; saveAuthSession();
  try{ sessionStorage.removeItem('leaderSessionKey'); }catch(e){}
  document.body.classList.remove('leader-mode');
  state.currentPage = 'home';
  buildNav(); renderHeader(); renderPage();
}

async function triggerAddDailyPhoto(){
  const ok = await verifyAdminAccess();
  if(!ok) return;
  document.getElementById('hiddenDailyPhotoInput').click();
}

async function handleDailyPhotoUpload(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';

  try {
    const base64 = await readFileData(file);
    if(!state.dailyPhotos) state.dailyPhotos = [];
    state.dailyPhotos.unshift({
      id: uid('photo'),
      classId: state.activeClassId,
      url: base64,
      caption: file.name.substring(0, file.name.lastIndexOf('.')) || 'Ảnh hoạt động lớp',
      time: new Date().toISOString()
    });
    saveState();
    renderPage();
    toast('Đã tải ảnh lên thành công!');
  } catch(err){
    Swal.fire({icon:'error', title:'Lỗi tải ảnh', text: err.message});
  }
}

async function updatePhotoCaption(photoId, newCaption){
  const ok = await verifyAdminAccess();
  if(!ok) { renderPage(); return; }
  const p = state.dailyPhotos.find(x => x.id === photoId);
  if(p){
    p.caption = newCaption.trim();
    saveState(false);
    toast('Đã cập nhật ghi chú ảnh!');
  }
}

async function deleteDailyPhoto(photoId){
  const ok = await verifyAdminAccess();
  if(!ok) return;

  const r = await Swal.fire({
    icon: 'warning',
    title: 'Xóa bức ảnh này?',
    text: 'Ảnh sẽ bị xóa khỏi kho lưu trữ của lớp.',
    showCancelButton: true,
    confirmButtonText: 'Đồng ý xóa',
    cancelButtonText: 'Hủy',
    confirmButtonColor: '#dc2626'
  });

  if(!r.isConfirmed) return;
  state.dailyPhotos = state.dailyPhotos.filter(x => x.id !== photoId);
  saveState();
  renderPage();
  toast('Đã xóa ảnh!');
}

class="d-flex justify-content-between mt-3"><span>Mức độ tiếng ồn</span><strong id="noisePct">0%</strong></div><div class="noise-meter mt-2"><div class="noise-fill" id="noiseFill"></div></div><div id="noiseStatus" class="alert alert-success mt-3 mb-0">Lớp đang yên tĩnh — Tốt lắm!</div><div class="row text-center small mt-2"><div class="col bg-success-subtle p-2 rounded-start">Yên tĩnh<br>0–40%</div><div class="col bg-warning-subtle p-2">Hơi ồn<br>40–70%</div><div class="col bg-danger-subtle p-2 rounded-end">Rất ồn<br>70–100%</div></div></div>`}
